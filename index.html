<style>
  :root {
    --ink: #efe9dc;
    --ink-dim: rgba(239, 233, 220, 0.62);
    --pill: rgba(18, 22, 20, 0.55);
    --pill-line: rgba(255, 255, 255, 0.08);
    --accent: #f2d98c;
    --accent-ink: #1d1a12;
  }
  body[data-time="day"] { --ink: #1f2b29; --ink-dim: rgba(31, 43, 41, 0.66); }
  /* light text over white clouds: a soft dark halo (two wide, one tight) keeps it readable without a visible box */
  body:not([data-time="day"]) :is(.brand, .crumb, .card h1, .card p, .kicker, .card a, .hint) {
    text-shadow: 0 0 1px rgba(14,24,23,.7), 0 0 4px rgba(14,24,23,.6), 0 0 12px rgba(14,24,23,.55), 0 0 28px rgba(14,24,23,.45); }
  body:not([data-time="day"]) { --ink-dim: rgba(239, 233, 220, 0.82); }
  /* soft dark fade behind the header so it holds up over bright clouds */
  .top::before { content: ""; position: absolute; inset: 0 0 -24px 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .6s;
    background: linear-gradient(rgba(14,24,23,.5), rgba(14,24,23,.28) 55%, rgba(14,24,23,0)); }
  body:not([data-time="day"]) .top::before { opacity: 1; }
  body:not([data-time="day"]) .brand .mark { background: rgba(14,24,23,.35); }
  /* and a gentle always-on scrim behind the card; close-ups still get the stronger one */
  body:not([data-time="day"]) .card::before { opacity: .55; }
  body:not([data-time="day"]).close .card::before { opacity: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4a6662; color: var(--ink);
    font-family: "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; }
  #bg, #stage, #fx { position: fixed; inset: 0; width: 100%; height: 100%; }
  #stage { touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #fx { pointer-events: none; }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 18px;
    padding: 18px 22px; pointer-events: none; z-index: 5; }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; }
  .brand .mark { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--ink-dim);
    display: grid; place-items: center; font-family: "Instrument Serif", serif; font-size: 17px; letter-spacing: 0; }
  .brand b { font-weight: 700; }
  .brand .dim, .crumb span { color: var(--ink-dim); }
  .crumb { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; padding-left: 18px;
    border-left: 1px solid var(--pill-line); white-space: nowrap; }
  .spacer { flex: 1; }
  .seg { display: flex; padding: 4px; gap: 2px; background: var(--pill); border: 1px solid var(--pill-line);
    border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #efe9dc; }
  .seg button, .pill { white-space: nowrap; padding: 7px 12px; border-radius: 7px; font-size: 12px; font-weight: 500; color: rgba(239,233,220,.78); }
  .seg button:hover, .pill:hover { color: #fff; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .pill { white-space: nowrap; background: var(--pill); border: 1px solid var(--pill-line); border-radius: 10px; padding: 11px 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  .card { position: fixed; left: 34px; bottom: 104px; max-width: 420px; z-index: 4; transition: opacity .45s ease, transform .45s ease; }
  .card.out { opacity: 0; transform: translateY(8px); }
  /* close-ups put busy scenery behind the card; a soft scrim keeps it readable */
  /* closest-side, so the gradient is fully clear before it reaches the box's edges (no hard line) */
  .card::before { content: ""; position: absolute; inset: -110px -150px -100px -130px; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side at 50% 55%, rgba(14,24,23,.62), rgba(14,24,23,.42) 45%, rgba(14,24,23,.14) 75%, rgba(14,24,23,0));
    opacity: 0; transition: opacity .6s; }
  body.close .card::before { opacity: 1; }
  .kicker { display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: .26em; color: var(--ink-dim); }
  .kicker .line { width: 34px; height: 1px; background: currentColor; }
  .card h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(44px, 5.4vw, 68px); line-height: 1; margin: 12px 0 12px; letter-spacing: -.01em; }
  .card p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ink-dim); }
  .card ul { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .card a { display: inline-block; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 7px 12px; border: 1px solid var(--ink-dim); border-radius: 999px; background: rgba(18, 22, 20, 0.5); transition: background .2s, color .2s; }
  .card a:hover { background: var(--ink); color: #111; }
  .card a[data-embed="video"]::before { content: "▶"; font-size: 9px; margin-right: 7px; vertical-align: 1px; }

  /* links to a clip or PDF open here instead of a new tab: a small floating player that can go full size */
  .pip { position: fixed; right: 26px; bottom: 84px; width: min(440px, calc(100vw - 32px)); z-index: 7; display: flex; flex-direction: column;
    background: rgba(14, 18, 17, 0.92); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; overflow: hidden; color: #efe9dc;
    box-shadow: 0 18px 50px rgba(0,0,0,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .25s ease, transform .25s ease; }
  .pip[hidden] { display: none; }
  .pip.enter { opacity: 0; transform: translateY(10px) scale(.98); }
  .pip-bar { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; cursor: grab; touch-action: none; user-select: none; }
  .pip.dragging .pip-bar { cursor: grabbing; }
  .pip-title { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pip-bar button, .pip-bar a { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; font-size: 15px; line-height: 1;
    color: rgba(239,233,220,.75); text-decoration: none; }
  .pip-bar button:hover, .pip-bar a:hover { background: rgba(255,255,255,.1); color: #fff; }
  .pip-body { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .pip[data-kind="doc"] .pip-body { aspect-ratio: auto; height: min(62vh, 560px); background: #fff; }
  .pip iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .pip.dragging iframe { pointer-events: none; }
  .pip.big { left: 24px !important; top: 24px !important; right: 24px; bottom: 24px; width: auto; }
  .pip.big .pip-body { flex: 1; aspect-ratio: auto; height: auto; }
  .pip.big .pip-bar { cursor: default; }
  .pip[data-kind="form"] .pip-body { aspect-ratio: auto; background: none; }
  .pip[data-kind="form"] #pipBig, .pip[data-kind="form"] #pipOut { display: none; }
  .pip-form { display: grid; gap: 12px; padding: 6px 16px 16px; }
  .pip-form label { display: grid; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(239,233,220,.7); }
  .pip-form label i { font-style: normal; font-weight: 500; letter-spacing: .04em; text-transform: none; opacity: .6; margin-left: 6px; }
  .pip-form input, .pip-form textarea { font: inherit; font-size: 14px; color: #efe9dc; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 10px 12px; resize: vertical; }
  .pip-form input:focus, .pip-form textarea:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,.09); }
  .pip-form .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .pip-form-row { display: flex; align-items: center; gap: 12px; }
  .pip-form button[type="submit"] { padding: 10px 18px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; }
  .pip-form button[type="submit"]:disabled { opacity: .55; cursor: default; }
  .pip-status { flex: 1; font-size: 12px; line-height: 1.45; color: rgba(239,233,220,.75); }
  .pip-status a { color: var(--accent); }

  .chapters { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; z-index: 5;
    background: rgba(18, 22, 20, 0.62); border: 1px solid var(--pill-line); border-radius: 10px; padding: 4px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
  .chapters::-webkit-scrollbar { display: none; }
  .chapters button { position: relative; padding: 12px 20px 14px; min-width: 118px; text-align: left; font-size: 13px; color: rgba(239,233,220,.7); border-radius: 6px; white-space: nowrap; }
  .chapters button span { font-size: 11px; opacity: .55; margin-right: 10px; }
  .chapters button:hover { color: #fff; }
  .chapters button[aria-current="true"] { color: #fff; }
  .chapters button[aria-current="true"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; background: var(--accent); border-radius: 2px; }

  .hint { position: fixed; right: 26px; bottom: 30px; z-index: 4; font-size: 12px; color: var(--ink-dim); letter-spacing: .04em; transition: opacity .4s; }
  .angle { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); z-index: 4; font-size: 11px; letter-spacing: .22em;
    text-transform: uppercase; padding: 8px 14px; border-radius: 999px; background: var(--pill); color: #efe9dc;

  body[data-mode="fp"] #trueAngle { display: none; }
  #soundBtn { display: flex; align-items: center; gap: 8px; }
  .snd-ico { display: inline-flex; align-items: flex-end; justify-content: space-between; width: 10px; height: 11px;

  .snd-ico::before, .snd-ico::after { content: ""; width: 2px; height: 4px; background: currentColor; border-radius: 1px; }
  #soundBtn[aria-pressed="true"] { color: #fff; }
  #soundBtn[aria-pressed="true"] .snd-ico::before, #soundBtn[aria-pressed="true"] .snd-ico::after { animation: eq 1.1s ease-in-out infinite alternate; }
  #soundBtn[aria-pressed="true"] .snd-ico::after { animation-delay: -.5s; }
  @keyframes eq { from { height: 3px; } to { height: 11px; } }
  @media (prefers-reduced-motion: reduce) { #soundBtn .snd-ico::before, #soundBtn .snd-ico::after { animation: none !important; } }
  .fallback { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }

  @media (max-width: 1100px) { .crumb { display: none; } }
  @media (max-width: 760px) {
    .top { flex-wrap: wrap; padding: 14px 16px; gap: 8px; }
    .brand { width: 100%; }
    .spacer { display: none; }
    .seg button { padding: 6px 9px; font-size: 11px; }
    #trueAngle { display: none; }
    #soundBtn { padding: 8px 10px; }
    #soundBtn .snd-lbl { display: none; }
    .card { left: 16px; right: 16px; bottom: 86px; max-width: none; }
    .card h1 { font-size: 40px; margin: 8px 0; }
    .card p { font-size: 14px; }
    .chapters { bottom: 14px; }
    .chapters button { min-width: 0; padding: 10px 14px 12px; }
    .hint { display: none; }
    .angle { top: 28vh; bottom: auto; }
    .pip { right: 16px; bottom: 76px; }
    .pip.big { left: 8px !important; top: 8px !important; right: 8px; bottom: 8px; }
  }
</style>
</head>

</section>

// churn, shared by every density sample at a pixel; cloudD is the density there (0 = clear air).
// Octaves are passed in: full detail only where the edge is seen, fewer for shading and shadows.
const CLOUDS = `float fbmC(vec2 p, int oct){ float a = 0.5, s = 0.0; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);

// No painted foam or lanes, so all three waters read as one.
const VERT_W = `#include <fog_pars_vertex>
varying vec2 vUv; varying vec3 vW;
void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
#include <fog_vertex>

vec3 seaLook(vec2 g, vec3 n, vec3 n0, float smear) {

          + texture2D(tRefl, suv + off * 0.6 - vec2(0.0, 0.004 * smear)) * 0.3;

    uniforms: waterU(), fog: true,
    vertexShader: VERT_W,
    fragmentShader: `#include <common>
#include <fog_pars_fragment>
#define NPT ${NPT}
uniform float uTime; uniform vec3 uSkyW; uniform vec4 uPT[NPT]; uniform float uPTY[NPT]; varying vec2 vUv;
${NOISE2}
${SEA_LOOK}
      void main(){
        vec2 p = vW.xz; float t = uTime;

// Weathered concrete: world-space mottling and rain streaks, and a dark wet band at the waterline.
// Wetness uses distance to the waterline, so the mirrored copy in the reflection gets the same band.
const CONCRETE_GLSL = `varying vec3 vWP; uniform float uSeaOn;
float h3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i), h3(i+vec3(1,0,0)), f.x), mix(h3(i+vec3(0,1,0)), h3(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)), h3(i+vec3(1,0,1)), f.x), mix(h3(i+vec3(0,1,1)), h3(i+vec3(1,1,1)), f.x), f.y), f.z); }
`;
function concreteify(mat, amt = 1) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uSeaOn = uSeaOn;
    sh.vertexShader = 'varying vec3 vWP;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n  vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = CONCRETE_GLSL + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      { float n = vn3(vWP*1.6)*0.5 + vn3(vWP*4.1)*0.3 + vn3(vWP*10.0)*0.2;
        float drip = vn3(vec3(vWP.x*5.0, vWP.y*0.3, vWP.z*5.0));
        diffuseColor.rgb *= mix(1.0, (0.82 + 0.24*n) * (1.0 - 0.16*smoothstep(0.55, 0.9, drip)), ${amt.toFixed(2)});
        float wet = (1.0 - smoothstep(0.15, 1.1, abs(vWP.y - (${SEA_Y.toFixed(1)})))) * uSeaOn;
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.4, 0.5, 0.44), wet * 0.85); }`);
  };

// Painted steel: fine pitting, rust blooms and drips that eat the paint and kill the sheen.
function metalify(mat, amt = 1) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uSeaOn = uSeaOn;
    sh.vertexShader = 'varying vec3 vWP;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n  vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = CONCRETE_GLSL + 'float mRust;\n' + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
      { float n = vn3(vWP*2.4)*0.55 + vn3(vWP*7.0)*0.3 + vn3(vWP*20.0)*0.15;
        float drip = vn3(vec3(vWP.x*11.0, vWP.y*0.6, vWP.z*11.0));
        mRust = smoothstep(0.56, 0.8, n + 0.22*drip - 0.06) * ${amt.toFixed(2)};
        float wet = (1.0 - smoothstep(0.1, 1.4, abs(vWP.y - (${SEA_Y.toFixed(1)})))) * uSeaOn;
        mRust = max(mRust, wet * 0.8 * ${amt.toFixed(2)});
        vec3 rustCol = mix(vec3(0.16, 0.05, 0.018), vec3(0.4, 0.15, 0.05), vn3(vWP*34.0));
        diffuseColor.rgb *= 0.82 + 0.3*vn3(vWP*46.0);
        diffuseColor.rgb = mix(diffuseColor.rgb, rustCol, mRust); }`)
      .replace('#include <specularmap_fragment>', `#include <specularmap_fragment>
      specularStrength *= 1.0 - 0.9*mRust;`);
  };
  mat.customProgramCacheKey = () => 'metal' + amt;
  return mat;
}

// The sea: a planar mirror (the world rendered upside down into reflRT) seen through travelling
// ripples, boat wakes and rain rings, fading into haze away from the pier.
const NTRAIL = 26;
const NTAP = 20;   // ripples you make: taps and the cursor's wake (x, z, start time, strength)
const reflRT = new THREE.WebGLRenderTarget(4, 4);
const seaU = {
  tRefl: { value: reflRT.texture }, uScreen: { value: new THREE.Vector2(1, 1) }, uTime,
  uSea: { value: new THREE.Color() }, uDeep: { value: new THREE.Color() }, uSky: { value: new THREE.Color() }, uFog: { value: new THREE.Color() },
  uCenter: { value: new THREE.Vector2() }, uFogR: { value: new THREE.Vector2(10, 34) },
  uView: { value: new THREE.Vector3() }, uSunDir: { value: SUN_DIR }, uSunCol: { value: new THREE.Color() },
  uTrail: { value: Array.from({ length: NTRAIL }, () => new THREE.Vector4(0, 0, 99, 0)) },
  uTap: { value: Array.from({ length: NTAP }, () => new THREE.Vector4(0, 0, -99, 0)) },
  uRain: { value: 0 }, uNight: { value: 0 },
  uFog2: { value: new THREE.Color() }, uDawn: { value: 0 }, uGlitX: { value: 0 },
  uSkyTop: { value: new THREE.Color() }, uSkyHor: { value: new THREE.Color() },
  uPuff: { value: Array.from({ length: 8 }, () => new THREE.Vector4()) },
  uCloudAmt: { value: 0 }, uCloudScale: { value: 0.09 }, uCloudCov: { value: 0.5 }, uCloudWind: { value: new THREE.Vector2(0.055, 0.02) }, uCloudLift: { value: 0 },
};
const seaMat = new THREE.ShaderMaterial({
  uniforms: seaU,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `#define NTRAIL ${NTRAIL}
#define NTAP ${NTAP}
uniform sampler2D tRefl; uniform vec2 uScreen; uniform float uTime, uRain, uNight, uDawn, uGlitX;
uniform vec3 uSea, uDeep, uSky, uFog, uFog2, uView, uSunDir, uSunCol; uniform vec2 uCenter, uFogR;
uniform vec4 uTrail[NTRAIL]; uniform vec4 uTap[NTAP];
uniform float uCloudAmt, uCloudScale, uCloudCov, uCloudLift; uniform vec2 uCloudWind; uniform vec4 uPuff[8];
varying vec3 vW;
${NOISE2}
${CLOUDS}
vec2 rainRings(vec2 p, float sc, float t) {

  float r = h2(cell);
  vec2 c = vec2(h2(cell + 1.3), h2(cell + 7.1)) * 0.6 + 0.2;
  float ph = fract(t * (0.7 + 0.4*r) + r);
  vec2 dv = f - c; float d = length(dv) + 1e-4, x = d - ph * 0.45;

}
void main(){
  vec2 p = vW.xz;
  float t = uTime;
  // long swells plus fine ripples, as a surface gradient
  vec2 g = vec2(0.0);
  for (int i = 0; i < 5; i++) {
    float fi = float(i), a = fi * 2.399 + 0.7;
    vec2 d = vec2(cos(a), sin(a));
    float k = 0.9 * pow(1.55, fi);
    g += d * 0.016 * cos(dot(d, p) * k + t * sqrt(k) * 1.1 + fi * 1.7);
  }
  float e = 0.15; vec2 q = p * 1.7 + vec2(t * 0.25, -t * 0.18);
  g += vec2(vn2(q + vec2(e, 0.0)) - vn2(q - vec2(e, 0.0)), vn2(q + vec2(0.0, e)) - vn2(q - vec2(0.0, e))) * 0.09;
  // wakes: rings dropped along the boat's track; together they form the V
  float crest = 0.0;
  for (int i = 0; i < NTRAIL; i++) {
    vec4 tr = uTrail[i];
    if (tr.w <= 0.0) continue;
    vec2 dv = p - tr.xy; float d = length(dv) + 1e-4;
    float x = d - (0.15 + tr.z * 0.5);
    float env = exp(-x*x*14.0) * tr.w * exp(-tr.z * 0.75) / (1.0 + tr.z);
    float osc = sin(x * 11.0);
    g += dv / d * osc * env * 0.13;
    crest += max(osc, 0.0) * env;
  }
  // touch: a tap drops a train of rings that spread and fade; the cursor's wake drops small ones
  for (int i = 0; i < NTAP; i++) {
    vec4 tp = uTap[i];
    float age = t - tp.z;
    if (tp.w <= 0.0 || age < 0.0 || age > 4.5) continue;
    vec2 dv = p - tp.xy; float d = length(dv) + 1e-4;
    float x = d - age * (0.9 + 0.5 * tp.w);
    float env = exp(-x*x*(x < 0.0 ? 1.4 : 7.0) / tp.w) * tp.w * exp(-age * 0.8) / (1.0 + 1.5 * age);   // a sharp front, rings trailing inside

  vec2 suv = gl_FragCoord.xy / uScreen;
  vec2 off = vec2((g.x - g.y) * 0.02, -(g.x + g.y) * 0.05);

            + texture2D(tRefl, suv + off * 1.6 + vec2(0.0, 0.004)).rgb * 0.3
            + texture2D(tRefl, suv + off * 0.6 - vec2(0.0, 0.004)).rgb * 0.3;

// ─────────────────────────────────────────────────────────────
//  Per-level materials (so each level can be hazed independently)
// ─────────────────────────────────────────────────────────────
const FIXED = { ink: '#2a2320', paper: '#fbfaf6', leaf: '#6e9f55', pencil: '#f2c14e', eraser: '#ef8fa0', wood: '#6b4a34', bobber: '#e2463c', lamp: '#ffd27a' };
const FIXED_C = Object.fromEntries(Object.entries(FIXED).map(([k, v]) => [k, new THREE.Color(v)]));
// hue / saturation / lightness offsets from the theme's creature colour: oranges through salmons
const SHADES = [[0, 0, 0], [0.025, 0.05, 0.07], [-0.012, -0.08, 0.1], [0.04, 0.1, -0.05], [-0.02, -0.12, 0.17], [0.015, 0.02, -0.09]];
function makeMats() {
  const lam = () => new THREE.MeshLambertMaterial();
  return {
    stone: concreteify(lam()), rim: concreteify(lam(), 0.7), creature: lam(), shades: SHADES.map(lam), ink: lam(), paper: lam(), leaf: lam(), pencil: lam(), eraser: lam(), wood: lam(), bobber: lam(),
    lamp: new THREE.MeshBasicMaterial(),
    foam: new THREE.MeshBasicMaterial(),
    water: waterMat(), fall: fallMat(),
    glow: new THREE.SpriteMaterial({ map: glowTex, color: 0xffc46b, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }),
    line: new THREE.LineBasicMaterial({ transparent: true, opacity: 0.7 }),
  };
}
const tmpC = new THREE.Color(), tmpC2 = new THREE.Color();
function applyHaze(M, h) {
  const set = (m, base) => { m.color.copy(base).multiplyScalar(1 - h); m.emissive.copy(cur.haze).multiplyScalar(h); };
  set(M.stone, cur.stone); set(M.rim, cur.rim); set(M.creature, cur.creature);
  SHADES.forEach((o, i) => set(M.shades[i], tmpC2.copy(cur.creature).offsetHSL(...o)));
  for (const k of ['ink', 'paper', 'leaf', 'pencil', 'eraser', 'wood', 'bobber']) set(M[k], FIXED_C[k]);
  const hz = (out, c) => out.copy(c).lerp(cur.haze, h);
  hz(M.lamp.color, tmpC.copy(FIXED_C.lamp).lerp(cur.stone, 1 - cur.night));
  hz(M.foam.color, cur.foam);
  for (const w of [M.water, M.fall]) { hz(w.uniforms.uA.value, cur.sea); hz(w.uniforms.uB.value, cur.seaDeep); w.uniforms.uHz.value = h; }
  hz(M.line.color, FIXED_C.ink);
  M.glow.opacity = cur.night * (1 - h) * 0.9;
}

// ─────────────────────────────────────────────────────────────
//  Mesh helpers
// ─────────────────────────────────────────────────────────────
// Every box gets a hairline bevel with smooth normals (an edge loop close to the corner, then smooth),
// so edges catch a thin highlight instead of cutting off dead sharp.
const BEVEL = 0.02, BEVEL_SEG = 2;
function box(mat, x0, x1, y0, y1, z0, z1, skipFace = -1) {
  const w = x1 - x0, h = y1 - y0, d = z1 - z0;
  const r = Math.min(BEVEL, Math.min(w, h, d) * 0.4);
  const geo = new RoundedBoxGeometry(w, h, d, BEVEL_SEG, r);
  if (skipFace >= 0) {  // drop one face (0..5 = +x,-x,+y,-y,+z,-z); used where overlay pieces meet the main pass
    const gr = geo.groups[skipFace], n = geo.attributes.position.count;
    const idx = geo.index ? Array.from(geo.index.array) : Array.from({ length: n }, (_, i) => i);
    idx.splice(gr.start, gr.count);
    geo.setIndex(idx);
  }
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return m;
}
function quad(mat, pts, uvs) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts.flat(), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs.flat(), 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  return new THREE.Mesh(g, mat);
}
function waterRect(mat, x0, x1, z0, z1, y, uvFn) {
  const pts = [[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]];
  return quad(mat, pts, pts.map(p => uvFn(p[0], p[2])));
}
function stick(mat, a, b, t) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.BoxGeometry(t, d.length(), t), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}
function setLayer(obj, n) { obj.traverse(o => o.layers.set(n)); }

// Little cube, each in a slightly different orange/salmon
let shadeN = 0;
function creature(M, { glasses = false, pencil = false } = {}) {
  const g = new THREE.Group();
  const B = 0.72, H = 0.64, legH = 0, zf = B / 2;
  const body = M.shades[shadeN++ % M.shades.length];
  g.add(box(body, -B / 2, B / 2, legH, legH + H, -B / 2, B / 2));
  const eyeY = legH + H * 0.6;
  const eyes = [box(M.ink, -0.21, -0.12, eyeY - 0.07, eyeY + 0.07, zf, zf + 0.02), box(M.ink, 0.12, 0.21, eyeY - 0.07, eyeY + 0.07, zf, zf + 0.02)];
  eyes.forEach(e => g.add(e));
  const squint = new THREE.Group();
  for (const [cx, dir] of [[-0.165, 1], [0.165, -1]]) {
    for (const s of [1, -1]) {
      const b = box(M.ink, -0.07, 0.07, -0.018, 0.018, 0, 0.02);
      b.position.set(cx, eyeY + s * 0.035, zf + 0.01); b.rotation.z = s * dir * 0.5;
      squint.add(b);
    }
  }
  squint.visible = false; g.add(squint);
  g.add(box(M.ink, -0.05, 0.05, eyeY - 0.17, eyeY - 0.14, zf, zf + 0.02));
  let shades = null;
  if (glasses) {
    shades = new THREE.Group();
    shades.add(box(M.ink, -0.29, -0.03, -0.075, 0.06, 0, 0.035));
    shades.add(box(M.ink, 0.03, 0.29, -0.075, 0.06, 0, 0.035));
    shades.add(box(M.ink, -0.035, 0.035, 0.01, 0.045, 0, 0.03));
    shades.add(box(M.ink, -0.33, -0.29, 0.0, 0.045, -0.3, 0.03));
    shades.add(box(M.ink, 0.29, 0.33, 0.0, 0.045, -0.3, 0.03));
    shades.position.set(0, eyeY, zf + 0.01);
    g.add(shades);
  }
  if (pencil) {
    const p = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.95, 6), M.pencil);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.17, 6), M.wood); tip.position.y = -0.56; tip.rotation.x = Math.PI;
    const er = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.072, 0.12, 6), M.eraser); er.position.y = 0.53;
    p.add(body, tip, er);

}

function shadesMesh(M) {
  const s = new THREE.Group();
  s.add(box(M.ink, -0.29, -0.03, -0.075, 0.06, -0.02, 0.02));
  s.add(box(M.ink, 0.03, 0.29, -0.075, 0.06, -0.02, 0.02));
  s.add(box(M.ink, -0.035, 0.035, 0.01, 0.045, -0.02, 0.02));
  return s;
}

function paperBoat(M) {
  const g = new THREE.Group();
  const sh = new THREE.Shape();
  sh.moveTo(-0.74, 0.36); sh.lineTo(0.74, 0.36); sh.lineTo(0.44, 0); sh.lineTo(-0.44, 0); sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.8, bevelEnabled: false });
  geo.translate(0, -0.14, -0.4);
  const hull = new THREE.Mesh(geo, M.paper);
  g.add(hull);
  // folded side flaps give it the paper-boat silhouette
  const f = new THREE.Shape(); f.moveTo(-0.5, 0); f.lineTo(0.5, 0); f.lineTo(0, 0.3); f.closePath();
  for (const z of [-0.41, 0.37]) {
    const flap = new THREE.Mesh(new THREE.ExtrudeGeometry(f, { depth: 0.04, bevelEnabled: false }), M.paper);
    flap.position.set(0, 0.2, z); g.add(flap);

// ─────────────────────────────────────────────────────────────
//  The Penrose waterway
//  z-bar runs from (0,0,L) to the seam at the origin; x-bar from (0,0,L) to
//  the pool at (L,0,L); the pillar climbs to (L,L,L), which projects onto the
//  origin under the isometric view. The last stretch of the z-bar is drawn
//  after a depth clear so it sits "in front" of the pillar top.
// ─────────────────────────────────────────────────────────────
const P1 = new THREE.Vector3(L, YW, L + W / 2 + 0.55);          // landing point in the pool
const G_FLOAT = new THREE.Vector3(L - 0.45, YW + 0.03, L + W * 1.18);
// A sluice gate closes the channel just behind the waterfall's lip (which, on screen, sits at z = W/2),
// so the boat stops against it and tips over right where the fall picks up.
const GATE_Z = W / 2 - 0.14;
const LIP_Z = W / 2 + 0.3;                           // where the fall phase starts, in channel terms
const PEND = new THREE.Vector3(0, YW, LIP_Z + 0.4);
const TIP_DROP = 0.3;
const curve = new THREE.CatmullRomCurve3([
  P1,
  new THREE.Vector3(L - 1.6, YW, L + W / 2 + 0.42),
  new THREE.Vector3(XP0 - 0.2, YW, L),
  new THREE.Vector3(W * 0.4, YW, L),
  new THREE.Vector3(0, YW, L - W * 0.4),
  new THREE.Vector3(0, YW, W * 1.6),
  PEND,
], false, 'centripetal');
const FISH_TIP = new THREE.Vector3(3.3, TOP + 1.95, L - 0.15);
const BOBBER = new THREE.Vector3(3.55, YW, L + 0.05);
const lineGeo = new THREE.BufferGeometry().setFromPoints([FISH_TIP, BOBBER]);
const LEDGE_Y = L - 1.5 * W;

// ─────────────────────────────────────────────────────────────
//  Keeping the illusion from any angle
//  The seam at the origin and the pillar top at (b, c, a) coincide on screen only when that gap
//  points straight at the camera. So instead of forbidding other angles, the loop re-proportions
//  its three arms (a = z-channel, b = x-channel, c = pillar) to keep the gap on the view axis.
//  Everything is built at nominal size (all arms L) and pushed through per-axis maps: identity
//  below a zone, shifted by (arm - L) above it, stretched linearly across it.
// ─────────────────────────────────────────────────────────────
const D = { a: L, b: L, c: L };
const MIN_ARM = { a: 4, b: 5, c: 6 };

const ARM = { x: 'b', y: 'c', z: 'a' };
function mapAxis(ax, v) {
  const [z0, z1] = ZONES[ax], d = D[ARM[ax]] - L;
  if (v <= z0) return v;
  if (v >= z1) return v + d;
  return z0 + (v - z0) * (z1 + d - z0) / (z1 - z0);
}
function slopeAxis(ax, v) {
  const [z0, z1] = ZONES[ax];
  return v > z0 && v < z1 ? (z1 + D[ARM[ax]] - L - z0) / (z1 - z0) : 1;

function buildLevel(M) {

  const live = o => { g.add(o); return o; };   // positioned every frame in already-mapped space

    add(box(M.rim, X0, X0 + RIM, FLOOR, TOP, z0, z1, cap), layer, 'stretch');

  for (const [x, z, r] of [[L + 0.55, L + 2.05, 0.3], [XP0 + 0.55, L + 2.0, 0.24]]) {
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.04, 14), M.leaf);

  }

  const pillarTop = [];
  pillarTop.push(add(box(M.rim, L - W / 2, L - W / 2 + RIM, PT - GROOVE, PT, L - W / 2, L + W / 2)));
  pillarTop.push(add(box(M.rim, L + W / 2 - RIM, L + W / 2, PT - GROOVE, PT, L - W / 2, L + W / 2)));

  pillarTop.push(add(waterRect(M.water, L - W / 2 + RIM, L + W / 2 - RIM, L - W / 2 + RIM, L + W / 2, L + YW, (x, z) => [(x - L + W / 2 - RIM) / IW, z])));

  for (const x of [X0 + RIM / 2, X1 - RIM / 2]) {
