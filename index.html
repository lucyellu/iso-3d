<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────────────────────
//  Site content: edit this block to make it yours.
// ─────────────────────────────────────────────────────────────
const SITE = {
  name: 'Your Name',
  role: 'studio',
  chapters: [
    { title: 'Hello', body: 'I design and build small, impossible things for the web. Objects that only make sense from one particular angle.', links: [] },
    { title: 'Work', body: 'Selected projects: interactive pieces, tools and experiments. Each one sits a level deeper than the last.',
      links: [{ label: 'Project one', href: '#' }, { label: 'Project two', href: '#' }, { label: 'Project three', href: '#' }] },
    { title: 'Writing', body: 'Notes on rendering, interfaces, and the craft of making the web feel handmade.',
      links: [{ label: 'Latest essay', href: '#' }, { label: 'Archive', href: '#' }] },
    { title: 'Lab', body: 'Unfinished loops, sketches and shaders. Things that almost close.',
      links: [{ label: 'Sketchbook', href: '#' }] },
    { title: 'Contact', body: 'Say hello. I read everything, eventually, once the boat comes back around.',
      links: [{ label: 'Email', href: 'mailto:hello@example.com' }, { label: 'GitHub', href: '#' }] },
  ],
};

// ─────────────────────────────────────────────────────────────
//  Geometry constants
// ─────────────────────────────────────────────────────────────
const L = 12, W = 1.8, RIM = 0.26, GROOVE = 0.45;
const TOP = W / 2, FLOOR = TOP - GROOVE, YW = TOP - 0.3;
const XP0 = L - 1.5 * W;              // where the x-channel meets the pool
const ZSPLIT = L * 0.45;              // z-bar beyond this is drawn in the "impossible" overlay pass
const S = 0.27;                       // recursion scale: each level sits in the hole of its parent
const LEVELS = [-2, -1, 0, 1, 2, 3, 4, 5];
const P = new THREE.Vector3(L / 3, 0, 2 * L / 3);   // projects to the triangle's centre
const ISO_AZ = Math.PI / 4, ISO_EL = Math.atan(1 / Math.SQRT2);
const OVERLAY = 1;

const PALETTES = {
  dawn:  { bgTop: '#f6d6c6', bgBot: '#a9bcdc', bokeh: ['#fff0dc', '#f6b9a6', '#cfdcf3', '#ffe6bf'], stone: '#f6e8dd', rim: '#fcf3ea', creature: '#ef7a5f',
           water: '#8adbd0', waterDeep: '#53b6b2', foam: '#f6fffc', sun: '#ffe1cc', sunI: 2.5, sky: '#fbe9ff', ground: '#a08c8c', hemiI: 1.15, haze: '#dcc8d0', night: 0 },
  day:   { bgTop: '#2a4a31', bgBot: '#0b1c12', bokeh: ['#b3cc70', '#6f9a4a', '#e6e8a2', '#3f6b3a'], stone: '#f2e4cf', rim: '#f9efe1', creature: '#ea7158',
           water: '#58c8b6', waterDeep: '#2c9d92', foam: '#f0fffb', sun: '#fff3dc', sunI: 2.6, sky: '#e6f6ff', ground: '#4a6b43', hemiI: 1.0, haze: '#2a4631', night: 0 },
  dusk:  { bgTop: '#2b2547', bgBot: '#d07c6a', bokeh: ['#f4a67c', '#b86d8c', '#ffd28c', '#6f5b93'], stone: '#eecbb7', rim: '#f6dccc', creature: '#e46553',
           water: '#4aaeaa', waterDeep: '#2c7584', foam: '#ffece0', sun: '#ffbb8c', sunI: 2.2, sky: '#baa6dc', ground: '#5a3f55', hemiI: 0.95, haze: '#5b3f5c', night: 0.35 },
  night: { bgTop: '#0a1030', bgBot: '#1b2950', bokeh: ['#2e4b8a', '#f6c86b', '#3b6aa6', '#8a7cff'], stone: '#8e97be', rim: '#a8b0d4', creature: '#cf6450',
           water: '#2f84a0', waterDeep: '#1a4d6a', foam: '#c4ecff', sun: '#a9b8ff', sunI: 1.0, sky: '#5465a8', ground: '#141c38', hemiI: 0.85, haze: '#18234a', night: 1 },
};
const COLOR_KEYS = ['bgTop', 'bgBot', 'stone', 'rim', 'creature', 'water', 'waterDeep', 'foam', 'sun', 'sky', 'ground', 'haze'];
const NUM_KEYS = ['sunI', 'hemiI', 'night'];
function toPalette(p) {
  const o = {};
  for (const k of COLOR_KEYS) o[k] = new THREE.Color(p[k]);
  for (const k of NUM_KEYS) o[k] = p[k];
  o.bokeh = p.bokeh.map(c => new THREE.Color(c));
  return o;
}
const target = { name: 'day', p: toPalette(PALETTES.day) };
const cur = toPalette(PALETTES.day);

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ─────────────────────────────────────────────────────────────
//  Renderer / scene
// ─────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.autoClear = false;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 2000);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(0.35, 1, 0.72);
hemi.layers.enableAll(); sun.layers.enableAll();
scene.add(hemi, sun);

// soft radial sprite used for lantern glow
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

// ─────────────────────────────────────────────────────────────
//  Water shaders
// ─────────────────────────────────────────────────────────────
const uTime = { value: 0 };
const VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const HASH = `float h1(float n){ return fract(sin(n*127.1)*43758.5453); }`;
function waterMat() {
  return new THREE.ShaderMaterial({
    uniforms: { uTime, uA: { value: new THREE.Color() }, uB: { value: new THREE.Color() }, uFoam: { value: new THREE.Color() } },
    vertexShader: VERT,
    fragmentShader: `uniform float uTime; uniform vec3 uA; uniform vec3 uB; uniform vec3 uFoam; varying vec2 vUv; ${HASH}
      void main(){
        float across = vUv.x, along = vUv.y;
        float lane = floor(across*6.0); float r = h1(lane+1.0);
        float s = fract(along*0.42 - uTime*(0.55+0.5*r) + r*3.0);
        float streak = smoothstep(0.0,0.05,s)*smoothstep(0.22,0.07,s)*step(0.35,r);
        float edge = smoothstep(0.2,0.0,min(across,1.0-across));
        float wave = 0.5+0.5*sin(along*2.1 - uTime*2.2 + across*5.0);
        vec3 col = mix(uB, uA, 0.5+0.4*wave);
        col = mix(col, uFoam, clamp(streak*0.55 + edge*0.5, 0.0, 1.0));
        gl_FragColor = vec4(col,1.0);
        #include <colorspace_fragment>
      }`,
    side: THREE.DoubleSide,
  });
}
function fallMat() {
  return new THREE.ShaderMaterial({
    uniforms: { uTime, uA: { value: new THREE.Color() }, uFoam: { value: new THREE.Color() } },
    vertexShader: VERT,
    fragmentShader: `uniform float uTime; uniform vec3 uA; uniform vec3 uFoam; varying vec2 vUv; ${HASH}
      void main(){
        float lane = floor(vUv.x*18.0); float r = h1(lane+3.0);
        float s = fract(vUv.y*(0.22+0.2*r) - uTime*(1.1+r*0.9) + r*5.0);
        float streak = smoothstep(0.0,0.12,s)*smoothstep(0.7,0.25,s);
        float edge = smoothstep(0.12,0.0,min(vUv.x,1.0-vUv.x));
        float lip = smoothstep(0.5,0.0,vUv.y);
        vec3 col = mix(uA, uFoam, clamp(0.35 + 0.55*streak + edge*0.4 + lip*0.3, 0.0, 1.0));
        gl_FragColor = vec4(col, 0.8 + 0.18*streak);
        #include <colorspace_fragment>
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
}

// ─────────────────────────────────────────────────────────────
//  Per-level materials (so each level can be hazed independently)
// ─────────────────────────────────────────────────────────────
const FIXED = { ink: '#2a2320', paper: '#fbfaf6', leaf: '#6e9f55', pencil: '#f2c14e', eraser: '#ef8fa0', wood: '#6b4a34', bobber: '#e2463c', lamp: '#ffd27a' };
const FIXED_C = Object.fromEntries(Object.entries(FIXED).map(([k, v]) => [k, new THREE.Color(v)]));
function makeMats() {
  const lam = () => new THREE.MeshLambertMaterial();
  return {
    stone: lam(), rim: lam(), creature: lam(), ink: lam(), paper: lam(), leaf: lam(), pencil: lam(), eraser: lam(), wood: lam(), bobber: lam(),
    lamp: new THREE.MeshBasicMaterial(),
    foam: new THREE.MeshBasicMaterial(),
    water: waterMat(), fall: fallMat(),
    glow: new THREE.SpriteMaterial({ map: glowTex, color: 0xffc46b, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }),
    line: new THREE.LineBasicMaterial({ transparent: true, opacity: 0.7 }),
  };
}
const tmpC = new THREE.Color();
function applyHaze(M, h) {
  const set = (m, base) => { m.color.copy(base).multiplyScalar(1 - h); m.emissive.copy(cur.haze).multiplyScalar(h); };
  set(M.stone, cur.stone); set(M.rim, cur.rim); set(M.creature, cur.creature);
  for (const k of ['ink', 'paper', 'leaf', 'pencil', 'eraser', 'wood', 'bobber']) set(M[k], FIXED_C[k]);
  const hz = (out, c) => out.copy(c).lerp(cur.haze, h);
  hz(M.lamp.color, tmpC.copy(FIXED_C.lamp).lerp(cur.stone, 1 - cur.night));
  hz(M.foam.color, cur.foam);
  hz(M.water.uniforms.uA.value, cur.water); hz(M.water.uniforms.uB.value, cur.waterDeep); hz(M.water.uniforms.uFoam.value, cur.foam);
  hz(M.fall.uniforms.uA.value, cur.water); hz(M.fall.uniforms.uFoam.value, cur.foam);
  hz(M.line.color, FIXED_C.ink);
  M.glow.opacity = cur.night * (1 - h) * 0.9;
}

// ─────────────────────────────────────────────────────────────
//  Mesh helpers
// ─────────────────────────────────────────────────────────────
function box(mat, x0, x1, y0, y1, z0, z1, skipFace = -1) {
  const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  if (skipFace >= 0) {  // drop one face (0..5 = +x,-x,+y,-y,+z,-z); used where overlay pieces meet the main pass
    const idx = Array.from(geo.index.array);
    idx.splice(skipFace * 6, 6);
    geo.setIndex(idx);
  }
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return m;
}
function quad(mat, pts, uvs) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts.flat(), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs.flat(), 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  return new THREE.Mesh(g, mat);
}
function waterRect(mat, x0, x1, z0, z1, y, uvFn) {
  const pts = [[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]];
  return quad(mat, pts, pts.map(p => uvFn(p[0], p[2])));
}
function stick(mat, a, b, t) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.BoxGeometry(t, d.length(), t), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}
function setLayer(obj, n) { obj.traverse(o => o.layers.set(n)); }

// Little cube-octopus
function creature(M, { glasses = false, pencil = false } = {}) {
  const g = new THREE.Group();
  const B = 0.72, H = 0.64, legH = 0.16, zf = B / 2;
  g.add(box(M.creature, -B / 2, B / 2, legH, legH + H, -B / 2, B / 2));
  for (let i = 0; i < 4; i++) {
    const x = -B / 2 + 0.1 + i * (B - 0.2) / 3;
    g.add(box(M.creature, x - 0.055, x + 0.055, 0, legH + 0.01, zf - 0.13, zf - 0.02));
    g.add(box(M.creature, x - 0.055, x + 0.055, 0.02, legH + 0.01, -zf + 0.02, -zf + 0.13));
  }
  g.add(box(M.creature, -B / 2 - 0.09, -B / 2, legH + 0.16, legH + 0.3, -0.07, 0.07));
  g.add(box(M.creature, B / 2, B / 2 + 0.09, legH + 0.16, legH + 0.3, -0.07, 0.07));
  const eyeY = legH + H * 0.6;
  const eyes = [box(M.ink, -0.21, -0.12, eyeY - 0.07, eyeY + 0.07, zf, zf + 0.02), box(M.ink, 0.12, 0.21, eyeY - 0.07, eyeY + 0.07, zf, zf + 0.02)];
  eyes.forEach(e => g.add(e));
  const squint = new THREE.Group();
  for (const [cx, dir] of [[-0.165, 1], [0.165, -1]]) {
    for (const s of [1, -1]) {
      const b = box(M.ink, -0.07, 0.07, -0.018, 0.018, 0, 0.02);
      b.position.set(cx, eyeY + s * 0.035, zf + 0.01); b.rotation.z = s * dir * 0.5;
      squint.add(b);
    }
  }
  squint.visible = false; g.add(squint);
  g.add(box(M.ink, -0.05, 0.05, eyeY - 0.17, eyeY - 0.14, zf, zf + 0.02));
  let shades = null;
  if (glasses) {
    shades = new THREE.Group();
    shades.add(box(M.ink, -0.29, -0.03, -0.075, 0.06, 0, 0.035));
    shades.add(box(M.ink, 0.03, 0.29, -0.075, 0.06, 0, 0.035));
    shades.add(box(M.ink, -0.035, 0.035, 0.01, 0.045, 0, 0.03));
    shades.add(box(M.ink, -0.33, -0.29, 0.0, 0.045, -0.3, 0.03));
    shades.add(box(M.ink, 0.29, 0.33, 0.0, 0.045, -0.3, 0.03));
    shades.position.set(0, eyeY, zf + 0.01);

  add(box(M.rim, XP0, XP0 + RIM, FLOOR, TOP, L + W / 2 - RIM, PZ1 - RIM));

  for (const [x, z, r] of [[L + 0.55, L + 2.05, 0.3], [XP0 + 0.55, L + 2.0, 0.24]]) {

  add(box(M.rim, L + W / 2 - RIM, L + W / 2, PT - GROOVE, PT, L - W / 2, L + W / 2));

  add(waterRect(M.water, L - W / 2 + RIM, L + W / 2 - RIM, L - W / 2 + RIM, L + W / 2, L + YW, (x, z) => [(x - L + W / 2 - RIM) / IW, z]));

  const fall = quad(M.fall, [[fx0, fy0, fz], [fx1, fy0, fz], [fx1, fy1, fz], [fx0, fy1, fz]], [[0, 0], [1, 0], [1, fy0 - fy1], [0, fy0 - fy1]]);

  const lookout = creature(M, { pencil: true });

  const rings = [];
  for (let i = 0; i < 7; i++) {

const levels = LEVELS.map(k => {
  const M = makeMats();
  const lv = buildLevel(M);
  lv.k = k;
  const sc = Math.pow(S, k);
  lv.g.scale.setScalar(sc);
  lv.g.position.copy(P).multiplyScalar(1 - sc);
  scene.add(lv.g);
  return lv;
});
const lv0 = levels.find(l => l.k === 0);

// ─────────────────────────────────────────────────────────────
//  Loop timeline (a pure function of time, so every level agrees)
// ─────────────────────────────────────────────────────────────
const SETTLE = 1.0, TIP = 0.45, FALL = 0.95, SPEED = 2.1;
const ROUTE = curve.getLength() / SPEED;
const T_LOOP = SETTLE + ROUTE + TIP + FALL;
const yawOf = d => Math.atan2(-d.z, d.x);
const YAW0 = yawOf(curve.getTangentAt(0));
const smooth = u => u * u * (3 - 2 * u);
const clamp01 = u => Math.min(1, Math.max(0, u));
function lerpAngle(a, b, u) { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * u; }
const tV = new THREE.Vector3();
function boatAt(t, out) {
  let tl = ((t % T_LOOP) + T_LOOP) % T_LOOP;
  out.t = tl;
  if (tl < SETTLE) {
    const u = tl / SETTLE;
    out.phase = 'settle'; out.u = u; out.pos.copy(P1);
    out.pos.y += -0.2 * Math.sin(Math.PI * Math.min(1, u * 1.4)) * (1 - u);
    out.yaw = lerpAngle(-Math.PI / 2, YAW0, smooth(u)); out.pitch = 0.3 * (1 - smooth(Math.min(1, u * 2))); out.layer = 0;
    return out;
  }
  tl -= SETTLE;
  if (tl < ROUTE) {
    const u = tl / ROUTE;
    curve.getPointAt(u, out.pos); out.yaw = yawOf(curve.getTangentAt(u, tV)); out.pitch = 0;
    out.pos.y += 0.03 * Math.sin(tl * 4);
    out.phase = 'route'; out.u = u; out.layer = (out.pos.x < W / 2 + 0.2 && out.pos.z < ZSPLIT) ? OVERLAY : 0;
    return out;
  }
  tl -= ROUTE;
  if (tl < TIP) {
    const u = tl / TIP;
    out.pos.copy(PEND); out.pos.z -= 0.2 * u; out.pos.y -= 0.45 * u * u;
    out.yaw = Math.PI / 2; out.pitch = 0.7 * u; out.layer = OVERLAY; out.phase = 'tip'; out.u = u;
    return out;
  }
  tl -= TIP;
  const u = tl / FALL;
  out.pos.set(L, L + YW - L * u * u, L + W / 2 + 0.3 + 0.25 * u);
  out.yaw = -Math.PI / 2; out.pitch = 1.2 - 0.9 * u; out.layer = 0; out.phase = 'fall'; out.u = u;

}
const mkState = () => ({ pos: new THREE.Vector3(), yaw: 0, pitch: 0, layer: 0, phase: '', u: 0, t: 0 });
const A = mkState(), R = mkState();
const SPLASH_V = Array.from({ length: 12 }, (_, i) => {
  const a = (i / 12) * Math.PI * 2 + Math.sin(i * 7.1) * 0.4, sp = 0.9 + ((i * 37) % 10) / 10;
  return new THREE.Vector3(Math.cos(a) * sp, 2.6 + ((i * 53) % 10) / 6, Math.sin(a) * sp);
});
const UB0 = 0.05, UB1 = 0.105;
const blink = (t, off) => (((t + off) % 3.9) < 0.12 ? 0.12 : 1);
const headPos = new THREE.Vector3();

function animate(t) {
  boatAt(t, A);
  // Where the rider's face is (level-local), for the shades to fly back to
  lv0.boat.position.copy(A.pos); lv0.boat.rotation.set(0, A.yaw, -A.pitch);
  lv0.rider.g.rotation.y = Math.PI / 4 - A.yaw;
  lv0.boat.updateMatrixWorld(true);
  lv0.rider.shades.getWorldPosition(headPos);
  headPos.sub(lv0.g.position).divideScalar(lv0.g.scale.x);

  // shades state
  let shadesOn = true, fsVis = false; const fsPos = new THREE.Vector3(), fsRot = new THREE.Euler();
  const squint = A.phase === 'fall' || (A.phase === 'settle' && A.u < 0.6);
  if (A.phase === 'settle') {
    shadesOn = false; fsVis = true;
    const v = clamp01(A.u / 0.6);
    fsPos.lerpVectors(new THREE.Vector3(P1.x, P1.y + 0.9, P1.z), G_FLOAT, v); fsPos.y += 1.3 * Math.sin(Math.PI * v);
    fsRot.set(-Math.PI / 2 * v, v * 9, 0);

    shadesOn = false; fsVis = true;
    if (A.u < UB0) {

    } else {

      fsRot.set(-Math.PI / 2 * (1 - v), (9 + Math.PI / 4 * 0) * (1 - v) + (Math.PI / 4) * v, 0);
    }
  }

  const splashAge = A.phase === 'settle' ? A.t : -1;
  const rings = [];
  const RI = 0.45;
  for (let j = 0; j < 7; j++) {
    const ts = Math.floor(t / RI) * RI - j * RI, age = t - ts;
    boatAt(ts, R);
    const ok = (R.phase === 'route' || R.phase === 'settle') && age < 3.1;
    rings.push({ ok, x: R.pos.x, z: R.pos.z, layer: R.layer, s: 0.45 + age * 0.33, o: 0.55 * (1 - age / 3.1) });
  }
  const bobY = YW + 0.03 * Math.sin(t * 2.6) - (((t % 7.3) < 0.35) ? 0.12 : 0);

  for (const lv of levels) {
    lv.boat.position.copy(A.pos); lv.boat.rotation.set(0, A.yaw, -A.pitch);
    setLayer(lv.boat, A.layer);
    lv.rider.g.rotation.y = Math.PI / 4 - A.yaw;
    lv.rider.shades.visible = shadesOn;
    lv.rider.squint.visible = squint && !shadesOn;
    lv.rider.eyes.forEach(e => { e.visible = !squint || shadesOn; e.scale.y = blink(t, 0.4); });
    lv.fshades.visible = fsVis; lv.fshades.position.copy(fsPos); lv.fshades.rotation.copy(fsRot);
    lv.fisher.eyes.forEach(e => e.scale.y = blink(t, 1.7));
    lv.lookout.eyes.forEach(e => e.scale.y = blink(t, 2.9));
    lv.lookout.g.rotation.y = Math.PI / 4 + 0.35 * Math.sin(Math.atan2(A.pos.x - L, A.pos.z - L) * 0.5 + 0.4);
    lv.lookout.g.position.y = LEDGE_Y + Math.abs(Math.sin(t * 2.2)) * 0.04;
    lv.bobber.position.y = bobY;
    lv.foam.forEach((f, i) => { f.position.y = YW + 0.03 + 0.04 * Math.sin(t * 7 + i * 1.7); f.scale.setScalar(0.8 + 0.3 * Math.sin(t * 5 + i)); });
    for (let i = 0; i < lv.rings.length; i++) {
      const r = rings[i], m = lv.rings[i];
      m.visible = r.ok && r.o > 0;
      if (!m.visible) continue;
      m.position.set(r.x, YW + 0.012, r.z); m.scale.setScalar(r.s);
      m.material.opacity = r.o; m.material.color.copy(lv.M.foam.color);
      m.layers.set(r.layer);
    }

      const p = lv.splash[i];
      const age = splashAge;
      if (age < 0 || age > 0.8) { p.visible = false; continue; }
      const v = SPLASH_V[i];
      p.position.set(P1.x + v.x * age, P1.y + v.y * age - 4.9 * age * age, P1.z + v.z * age);
      p.visible = p.position.y > YW - 0.05;
      p.scale.setScalar(1 - age);
    }
  }
}

// ─────────────────────────────────────────────────────────────
//  Camera: depth (recursion), orbit (breaking the illusion), ride
// ─────────────────────────────────────────────────────────────
const state = {
  mode: 'still', depth: 0, tween: null,
  yaw: 0, pitch: 0, vy: 0, vp: 0, dragging: false,
  ride: 0,
};
const camTarget = new THREE.Vector3();
const dir = new THREE.Vector3();
let aligned = true;

function viewParams() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  if (aspect < 0.85) return { halfH: Math.max(8.4, 7.4 / aspect), ox: 0, oy: 0.1, aspect };
  return { halfH: 8.6, ox: Math.min(0.34, 0.12 + (aspect - 1) * 0.25), oy: 0.02, aspect };
}

function updateCamera() {
  const vp = viewParams();
  const phi = state.depth - Math.floor(state.depth);
  const b = smooth(clamp01(state.ride));
  const halfH = THREE.MathUtils.lerp(vp.halfH * Math.pow(S, phi), 3.1, b);
  const ox = THREE.MathUtils.lerp(vp.ox, 0, b), oy = THREE.MathUtils.lerp(vp.oy, 0, b);

  dir.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
  camera.position.copy(camTarget).addScaledVector(dir, 600);
  camera.up.set(0, 1, 0);
  camera.lookAt(camTarget);
  const cx = -ox * vp.aspect * halfH, cy = -oy * halfH;
  camera.left = cx - vp.aspect * halfH; camera.right = cx + vp.aspect * halfH;
  camera.top = cy + halfH; camera.bottom = cy - halfH;
  camera.updateProjectionMatrix();
  aligned = Math.abs(state.yaw) < 0.002 && Math.abs(state.pitch) < 0.002;
}

function updateHaze() {
  const phi = state.depth - Math.floor(state.depth);
  for (const lv of levels) {
    const x = lv.k - phi;
    const h = x < 0 ? 1 - Math.exp(3.2 * x) : 0;
    applyHaze(lv.M, h);
    for (const d of lv.details) d.visible = h < 0.45;
    // off-angle, the ghosted parents would physically block the view, so fade them out
    const off = Math.abs(state.yaw) + Math.abs(state.pitch);
    lv.g.visible = x > -2.6 && (x > -0.35 || off < 0.04);
  }
}

// drag to orbit; springs back to the true angle
const el = renderer.domElement;
let lastX = 0, lastY = 0;
el.addEventListener('pointerdown', e => { state.dragging = true; lastX = e.clientX; lastY = e.clientY; el.setPointerCapture(e.pointerId); stage.classList.add('dragging'); hint.style.opacity = 0; });
el.addEventListener('pointermove', e => {
  if (!state.dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
  state.yaw = THREE.MathUtils.clamp(state.yaw - dx * 0.005, -0.9, 0.9);
  state.pitch = THREE.MathUtils.clamp(state.pitch + dy * 0.004, -0.45, 0.6);

  if (state.dragging) return;
  const k = 38, c = 2 * Math.sqrt(k) * 0.82;
  for (const [x, v] of [['yaw', 'vy'], ['pitch', 'vp']]) {
    const a = -k * state[x] - c * state[v];
    state[v] += a * dt; state[x] += state[v] * dt;
    if (Math.abs(state[x]) < 0.0015 && Math.abs(state[v]) < 0.01) { state[x] = 0; state[v] = 0; }
  }
}

// ─────────────────────────────────────────────────────────────
//  UI
// ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const hint = $('hint'), angleTag = $('angle');
$('brandName').textContent = SITE.name; $('brandRole').textContent = SITE.role;
$('brandMark').textContent = SITE.name.trim()[0] || '◬';
const N = SITE.chapters.length;
const chapNav = $('chapters');
SITE.chapters.forEach((c, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span>${i + 1}</span>${c.title}`;
  b.addEventListener('click', () => goChapter(i));
  chapNav.appendChild(b);
});
const mod = (a, n) => ((a % n) + n) % n;
let shownChapter = -1;
function currentChapter() { return mod(Math.round(state.depth), N); }
function renderCard(i, instant) {
  if (i === shownChapter) return;
  shownChapter = i;
  const c = SITE.chapters[i], card = $('card');
  [...chapNav.children].forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
  const fill = () => {
    $('kicker').textContent = `${String(i + 1).padStart(2, '0')} / ${String(N).padStart(2, '0')} · DEPTH ${Math.round(state.depth)}`;
    $('title').textContent = c.title; $('body').textContent = c.body;
    const ul = $('links'); ul.innerHTML = '';
    for (const l of c.links) { const li = document.createElement('li'); const a = document.createElement('a'); a.href = l.href; a.textContent = l.label; li.appendChild(a); ul.appendChild(li); }
    card.classList.remove('out');
  };
  if (instant) return fill();
  card.classList.add('out'); setTimeout(fill, 260);
}
function goChapter(i) {
  if (state.mode !== 'still') setMode('still');
  const cur = currentChapter();
  let d = i - cur;
  const to = Math.round(state.depth) + d;
  tweenDepth(to);
}
function tweenDepth(to) {
  const from = state.depth, dur = reduceMotion ? 0.01 : 1.2 + 0.45 * Math.abs(to - from);
  state.tween = { from, to, t: 0, dur };
}
function setMode(m) {
  state.mode = m;
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m ? 'true' : 'false'));
  if (m === 'ride' || m === 'still') tweenDepth(Math.round(state.depth));
}
document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
function setTime(name) {
  target.name = name; target.p = toPalette(PALETTES[name]);
  document.body.dataset.time = name;
  document.querySelectorAll('#timeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.time === name ? 'true' : 'false'));
}
document.querySelectorAll('#timeSeg button').forEach(b => b.addEventListener('click', () => setTime(b.dataset.time)));
$('trueAngle').addEventListener('click', () => { state.vy = -state.yaw * 6; state.vp = -state.pitch * 6; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goChapter(mod(currentChapter() + 1, N));
  if (e.key === 'ArrowLeft') goChapter(mod(currentChapter() - 1, N));
  if (e.key === ' ') { e.preventDefault(); setMode(state.mode === 'descend' ? 'still' : 'descend'); }
});
renderCard(0, true);
const qs = new URLSearchParams(location.search);
if (PALETTES[qs.get('time')]) { setTime(qs.get('time')); Object.assign(cur, toPalette(PALETTES[qs.get('time')])); }
if (['still', 'descend', 'ride'].includes(qs.get('mode'))) setMode(qs.get('mode'));
if (qs.has('depth')) { state.depth = +qs.get('depth'); state.tween = null; }
if (qs.has('yaw')) { state.yaw = +qs.get('yaw'); state.dragging = qs.has('hold'); }

function updatePalette(dt) {
  const k = 1 - Math.exp(-dt * 3.2);
  for (const key of COLOR_KEYS) cur[key].lerp(target.p[key], k);
  for (const key of NUM_KEYS) cur[key] += (target.p[key] - cur[key]) * k;
  cur.bokeh.forEach((c, i) => c.lerp(target.p.bokeh[i], k));
  sun.color.copy(cur.sun); sun.intensity = cur.sunI;
  hemi.color.copy(cur.sky); hemi.groundColor.copy(cur.ground); hemi.intensity = cur.hemiI;
  document.documentElement.style.background = cur.bgBot.getStyle();
}

// ─────────────────────────────────────────────────────────────
//  Background bokeh + foreground motes (2D canvases)
// ─────────────────────────────────────────────────────────────
const bg = $('bg'), bctx = bg.getContext('2d');
const fx = $('fx'), fctx = fx.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const blobs = Array.from({ length: 28 }, (_, i) => ({ x: Math.random(), y: Math.random(), r: rnd(0.05, 0.22), rot: rnd(0, Math.PI), el: rnd(0.35, 1),
  ci: i % 4, a: rnd(0.14, 0.42), sp: rnd(0.2, 0.8), ph: rnd(0, 6.28) }));
const motes = Array.from({ length: 46 }, () => ({ x: Math.random(), y: Math.random(), r: rnd(1, 2.6), sp: rnd(0.2, 1), ph: rnd(0, 6.28) }));
const rgba = (c, a) => { const o = {}; c.getRGB(o, THREE.SRGBColorSpace); return `rgba(${(o.r * 255) | 0},${(o.g * 255) | 0},${(o.b * 255) | 0},${a})`; };
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  bg.width = Math.ceil(innerWidth / 3); bg.height = Math.ceil(innerHeight / 3);
  const d = Math.min(devicePixelRatio, 2); fx.width = innerWidth * d; fx.height = innerHeight * d;
}
addEventListener('resize', resize); resize();

function drawBg(t) {
  const w = bg.width, h = bg.height, m = Math.max(w, h);
  const gr = bctx.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, rgba(cur.bgTop, 1)); gr.addColorStop(1, rgba(cur.bgBot, 1));
  bctx.globalCompositeOperation = 'source-over';
  bctx.fillStyle = gr; bctx.fillRect(0, 0, w, h);
  for (const b of blobs) {
    const x = (b.x + 0.015 * Math.sin(t * 0.07 * b.sp + b.ph)) * w, y = (b.y + 0.012 * Math.cos(t * 0.05 * b.sp + b.ph)) * h, r = b.r * m;
    bctx.save(); bctx.translate(x, y); bctx.rotate(b.rot + 0.05 * Math.sin(t * 0.1 + b.ph)); bctx.scale(1, b.el);
    const rg = bctx.createRadialGradient(0, 0, 0, 0, 0, r);
    const c = cur.bokeh[b.ci];
    rg.addColorStop(0, rgba(c, b.a)); rg.addColorStop(0.55, rgba(c, b.a * 0.55)); rg.addColorStop(1, rgba(c, 0));
    bctx.fillStyle = rg; bctx.beginPath(); bctx.arc(0, 0, r, 0, Math.PI * 2); bctx.fill(); bctx.restore();
  }
  const vg = bctx.createRadialGradient(w * 0.6, h * 0.5, m * 0.2, w * 0.5, h * 0.5, m * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${0.18 + cur.night * 0.2})`);
  bctx.fillStyle = vg; bctx.fillRect(0, 0, w, h);
}
function drawFx(t) {
  const w = fx.width, h = fx.height, d = Math.min(devicePixelRatio, 2);
  fctx.clearRect(0, 0, w, h);
  const night = cur.night;
  for (const p of motes) {
    const x = ((p.x + 0.02 * Math.sin(t * 0.3 * p.sp + p.ph) + t * 0.004 * p.sp) % 1) * w;
    const y = ((p.y - t * 0.006 * p.sp + 10) % 1) * h;
    const tw = 0.5 + 0.5 * Math.sin(t * (1.5 + p.sp * 2) + p.ph);
    const a = (0.25 + night * 0.65) * (night > 0.5 ? tw * tw : 0.6 + 0.4 * tw);
    const r = p.r * d * (1 + night * 1.6);
    const rg = fctx.createRadialGradient(x, y, 0, x, y, r * 4);
    const col = night > 0.5 ? `255,226,140` : `255,250,230`;
    rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(0.3, `rgba(${col},${a * 0.35})`); rg.addColorStop(1, `rgba(${col},0)`);
    fctx.fillStyle = rg; fctx.beginPath(); fctx.arc(x, y, r * 4, 0, Math.PI * 2); fctx.fill();
  }
}

// ─────────────────────────────────────────────────────────────
//  Main loop
// ─────────────────────────────────────────────────────────────
let last = performance.now() / 1000, simT = 0;
function frame(nowMs) {
  const now = nowMs / 1000, dt = Math.min(0.05, now - last); last = now;
  simT += dt * (reduceMotion ? 0.6 : 1);
  uTime.value = simT;
  updatePalette(dt);
  updateOrbit(dt);

  if (state.tween) {
    const tw = state.tween; tw.t += dt;
    const u = clamp01(tw.t / tw.dur), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    state.depth = tw.from + (tw.to - tw.from) * e;
    if (u >= 1) { state.depth = tw.to; state.tween = null; }
  } else if (state.mode === 'descend') {
    state.depth += dt * 0.16;
  }
  state.ride += ((state.mode === 'ride' ? 1 : 0) - state.ride) * (1 - Math.exp(-dt * 2.2));

  animate(simT);
  updateHaze();
  updateCamera();
  renderCard(currentChapter());
  angleTag.classList.toggle('show', !aligned);

  renderer.clear();
  if (aligned) {
    camera.layers.set(0); renderer.render(scene, camera);
    renderer.clearDepth();
    camera.layers.set(OVERLAY); renderer.render(scene, camera);
  } else {
    camera.layers.enableAll(); renderer.render(scene, camera);
  }
  drawBg(simT); drawFx(simT);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__iso = { state, setTime, setMode, goChapter };
</script>
