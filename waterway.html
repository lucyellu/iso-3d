<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────────────────────
//  Site content: edit this block to make it yours.
// ─────────────────────────────────────────────────────────────
// Each chapter has a camera view: yaw/pitch away from the true isometric angle (radians; the loop
// reshapes to keep closing within about ±0.5 yaw and -0.3..0.7 pitch), zoom (1 = whole loop) and
// focus ('loop', 'lookout', 'fisher' or 'rider').
const SITE = {

      links: [{ label: 'Read the paper', href: 'https://www.lulucy.org/post/study-of-prime-pairs-paper' },
              { label: 'Colab', href: 'https://colab.research.google.com/drive/1rCmKD5afjBGVD_aEKufKGqePYt_Jmh0w?usp=sharing' },
              { label: 'Code on GitHub', href: 'https://github.com/lucyellu/A-Novel-Sieve-in-the-Study-of-Prime-Numbers' }],
      view: { yaw: -0.3, pitch: -0.25 } },
    { title: 'Contact', body: 'Say hello. I read everything, eventually, once the boat comes back around.',
      links: [{ label: 'Email', href: 'mailto:lucylu@ualberta.net' },
              { label: 'GitHub', href: 'https://github.com/lucyellu' },
              { label: 'YouTube', href: 'https://www.youtube.com/@lucyxlu' },
              { label: 'X', href: 'https://x.com/laissez_fairie' },
              { label: 'Instagram', href: 'https://instagram.com/lucyellu' },
              { label: 'lulucy.org', href: 'https://www.lulucy.org' }],
      view: { yaw: 0.25, pitch: 0.12, zoom: 0.3, focus: 'lookout' } },

// ─────────────────────────────────────────────────────────────
//  Geometry constants
// ─────────────────────────────────────────────────────────────
const L = 12, W = 1.8, RIM = 0.26, GROOVE = 0.45;
const TOP = W / 2, FLOOR = TOP - GROOVE, YW = TOP - 0.3;
const XP0 = L - 1.5 * W;              // where the x-channel meets the pool
const ZSPLIT = L * 0.45;              // z-bar beyond this is drawn in the "impossible" overlay pass
// The loop is periodic along the view diagonal: copy k sits at k*(L,L,L). In the iso view every copy
// lands on the same pixels; in first person the copies join up into one endless descending path.
const STEP = new THREE.Vector3(L, L, L);
const COPIES = [-4, -3, -2, -1, 0, 1, 2, 3, 4];
const P = new THREE.Vector3(L / 3, 0, 2 * L / 3);   // projects to the triangle's centre (refit per frame)
const ISO_AZ = Math.PI / 4, ISO_EL = Math.atan(1 / Math.SQRT2);
const OVERLAY = 1;
const PRIME = 2;   // depth-only twins of the main z-bar, so the overlay pass still tucks behind its near rim
const DEPTH_ONLY = new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide });

const PALETTES = {
  dawn:  { bgTop: '#f6d6c6', bgBot: '#a9bcdc', bokeh: ['#fff0dc', '#f6b9a6', '#cfdcf3', '#ffe6bf'], stone: '#f6e8dd', rim: '#fcf3ea', creature: '#ef7a5f',
           water: '#8adbd0', waterDeep: '#53b6b2', foam: '#f6fffc', sun: '#ffe1cc', sunI: 2.5, sky: '#fbe9ff', ground: '#a08c8c', hemiI: 1.15, haze: '#dcc8d0', night: 0 },
  day:   { bgTop: '#2a4a31', bgBot: '#0b1c12', bokeh: ['#b3cc70', '#6f9a4a', '#e6e8a2', '#3f6b3a'], stone: '#f2e4cf', rim: '#f9efe1', creature: '#ea7158',
           water: '#58c8b6', waterDeep: '#2c9d92', foam: '#f0fffb', sun: '#fff3dc', sunI: 2.6, sky: '#e6f6ff', ground: '#4a6b43', hemiI: 1.0, haze: '#2a4631', night: 0 },
  dusk:  { bgTop: '#2b2547', bgBot: '#d07c6a', bokeh: ['#f4a67c', '#b86d8c', '#ffd28c', '#6f5b93'], stone: '#eecbb7', rim: '#f6dccc', creature: '#e46553',
           water: '#4aaeaa', waterDeep: '#2c7584', foam: '#ffece0', sun: '#ffbb8c', sunI: 2.2, sky: '#baa6dc', ground: '#5a3f55', hemiI: 0.95, haze: '#5b3f5c', night: 0.35 },
  night: { bgTop: '#0a1030', bgBot: '#1b2950', bokeh: ['#2e4b8a', '#f6c86b', '#3b6aa6', '#8a7cff'], stone: '#8e97be', rim: '#a8b0d4', creature: '#cf6450',
           water: '#2f84a0', waterDeep: '#1a4d6a', foam: '#c4ecff', sun: '#a9b8ff', sunI: 1.0, sky: '#5465a8', ground: '#141c38', hemiI: 0.85, haze: '#18234a', night: 1 },
};
const COLOR_KEYS = ['bgTop', 'bgBot', 'stone', 'rim', 'creature', 'water', 'waterDeep', 'foam', 'sun', 'sky', 'ground', 'haze'];
const NUM_KEYS = ['sunI', 'hemiI', 'night'];
function toPalette(p) {
  const o = {};
  for (const k of COLOR_KEYS) o[k] = new THREE.Color(p[k]);
  for (const k of NUM_KEYS) o[k] = p[k];
  o.bokeh = p.bokeh.map(c => new THREE.Color(c));
  return o;
}
const target = { name: 'day', p: toPalette(PALETTES.day) };
const cur = toPalette(PALETTES.day);

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ─────────────────────────────────────────────────────────────
//  Renderer / scene
// ─────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.autoClear = false;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 2000);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(0.35, 1, 0.72);
hemi.layers.enableAll(); sun.layers.enableAll();
scene.add(hemi, sun);

// soft radial sprite used for lantern glow
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

// ─────────────────────────────────────────────────────────────
//  Water shaders
// ─────────────────────────────────────────────────────────────
const uTime = { value: 0 };
const VERT = `#include <fog_pars_vertex>
varying vec2 vUv; void main(){ vUv = uv; vec4 mvPosition = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * mvPosition;
#include <fog_vertex>
}`;
const fogU = () => THREE.UniformsUtils.clone(THREE.UniformsLib.fog);
const HASH = `float h1(float n){ return fract(sin(n*127.1)*43758.5453); }`;
function waterMat() {
  return new THREE.ShaderMaterial({
    uniforms: { ...fogU(), uTime, uA: { value: new THREE.Color() }, uB: { value: new THREE.Color() }, uFoam: { value: new THREE.Color() } }, fog: true,
    vertexShader: VERT,
    fragmentShader: `#include <common>
#include <fog_pars_fragment>
uniform float uTime; uniform vec3 uA; uniform vec3 uB; uniform vec3 uFoam; varying vec2 vUv; ${HASH}
      void main(){
        float across = vUv.x, along = vUv.y;
        float lane = floor(across*6.0); float r = h1(lane+1.0);
        float s = fract(along*0.42 - uTime*(0.55+0.5*r) + r*3.0);
        float streak = smoothstep(0.0,0.05,s)*smoothstep(0.22,0.07,s)*step(0.35,r);
        float edge = smoothstep(0.2,0.0,min(across,1.0-across));
        float wave = 0.5+0.5*sin(along*2.1 - uTime*2.2 + across*5.0);
        vec3 col = mix(uB, uA, 0.5+0.4*wave);
        col = mix(col, uFoam, clamp(streak*0.55 + edge*0.5, 0.0, 1.0));
        gl_FragColor = vec4(col,1.0);
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
    side: THREE.DoubleSide,
  });
}
function fallMat() {
  return new THREE.ShaderMaterial({
    uniforms: { ...fogU(), uTime, uA: { value: new THREE.Color() }, uFoam: { value: new THREE.Color() } }, fog: true,
    vertexShader: VERT,
    fragmentShader: `#include <common>
#include <fog_pars_fragment>
uniform float uTime; uniform vec3 uA; uniform vec3 uFoam; varying vec2 vUv; ${HASH}
      void main(){
        float lane = floor(vUv.x*18.0); float r = h1(lane+3.0);
        float s = fract(vUv.y*(0.22+0.2*r) - uTime*(1.1+r*0.9) + r*5.0);
        float streak = smoothstep(0.0,0.12,s)*smoothstep(0.7,0.25,s);
        float edge = smoothstep(0.12,0.0,min(vUv.x,1.0-vUv.x));
        float lip = smoothstep(0.5,0.0,vUv.y);
        vec3 col = mix(uA, uFoam, clamp(0.35 + 0.55*streak + edge*0.4 + lip*0.3, 0.0, 1.0));
        gl_FragColor = vec4(col, 0.8 + 0.18*streak);
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
}

// ─────────────────────────────────────────────────────────────
//  Per-level materials (so each level can be hazed independently)
// ─────────────────────────────────────────────────────────────
const FIXED = { ink: '#2a2320', paper: '#fbfaf6', leaf: '#6e9f55', pencil: '#f2c14e', eraser: '#ef8fa0', wood: '#6b4a34', bobber: '#e2463c', lamp: '#ffd27a' };
const FIXED_C = Object.fromEntries(Object.entries(FIXED).map(([k, v]) => [k, new THREE.Color(v)]));
function makeMats() {
  const lam = () => new THREE.MeshLambertMaterial();
  return {
    stone: lam(), rim: lam(), creature: lam(), ink: lam(), paper: lam(), leaf: lam(), pencil: lam(), eraser: lam(), wood: lam(), bobber: lam(),
    lamp: new THREE.MeshBasicMaterial(),
    foam: new THREE.MeshBasicMaterial(),
    water: waterMat(), fall: fallMat(),
    glow: new THREE.SpriteMaterial({ map: glowTex, color: 0xffc46b, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }),
    line: new THREE.LineBasicMaterial({ transparent: true, opacity: 0.7 }),
  };
}
const tmpC = new THREE.Color();
function applyHaze(M, h) {
  const set = (m, base) => { m.color.copy(base).multiplyScalar(1 - h); m.emissive.copy(cur.haze).multiplyScalar(h); };
  set(M.stone, cur.stone); set(M.rim, cur.rim); set(M.creature, cur.creature);
  for (const k of ['ink', 'paper', 'leaf', 'pencil', 'eraser', 'wood', 'bobber']) set(M[k], FIXED_C[k]);
  const hz = (out, c) => out.copy(c).lerp(cur.haze, h);
  hz(M.lamp.color, tmpC.copy(FIXED_C.lamp).lerp(cur.stone, 1 - cur.night));
  hz(M.foam.color, cur.foam);
  hz(M.water.uniforms.uA.value, cur.water); hz(M.water.uniforms.uB.value, cur.waterDeep); hz(M.water.uniforms.uFoam.value, cur.foam);
  hz(M.fall.uniforms.uA.value, cur.water); hz(M.fall.uniforms.uFoam.value, cur.foam);
  hz(M.line.color, FIXED_C.ink);
  M.glow.opacity = cur.night * (1 - h) * 0.9;
}

// ─────────────────────────────────────────────────────────────
//  Mesh helpers
// ─────────────────────────────────────────────────────────────
function box(mat, x0, x1, y0, y1, z0, z1, skipFace = -1) {
  const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  if (skipFace >= 0) {  // drop one face (0..5 = +x,-x,+y,-y,+z,-z); used where overlay pieces meet the main pass
    const idx = Array.from(geo.index.array);
    idx.splice(skipFace * 6, 6);
    geo.setIndex(idx);
  }
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return m;
}
function quad(mat, pts, uvs) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts.flat(), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs.flat(), 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  return new THREE.Mesh(g, mat);
}
function waterRect(mat, x0, x1, z0, z1, y, uvFn) {
  const pts = [[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]];
  return quad(mat, pts, pts.map(p => uvFn(p[0], p[2])));
}
function stick(mat, a, b, t) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.BoxGeometry(t, d.length(), t), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}
function setLayer(obj, n) { obj.traverse(o => o.layers.set(n)); }

// Little cube-octopus
function creature(M, { glasses = false, pencil = false } = {}) {
  const g = new THREE.Group();
  const B = 0.72, H = 0.64, legH = 0.16, zf = B / 2;
  g.add(box(M.creature, -B / 2, B / 2, legH, legH + H, -B / 2, B / 2));
  for (let i = 0; i < 4; i++) {
    const x = -B / 2 + 0.1 + i * (B - 0.2) / 3;
    g.add(box(M.creature, x - 0.055, x + 0.055, 0, legH + 0.01, zf - 0.13, zf - 0.02));
    g.add(box(M.creature, x - 0.055, x + 0.055, 0.02, legH + 0.01, -zf + 0.02, -zf + 0.13));
  }
  g.add(box(M.creature, -B / 2 - 0.09, -B / 2, legH + 0.16, legH + 0.3, -0.07, 0.07));
  g.add(box(M.creature, B / 2, B / 2 + 0.09, legH + 0.16, legH + 0.3, -0.07, 0.07));
  const eyeY = legH + H * 0.6;
  const eyes = [box(M.ink, -0.21, -0.12, eyeY - 0.07, eyeY + 0.07, zf, zf + 0.02), box(M.ink, 0.12, 0.21, eyeY - 0.07, eyeY + 0.07, zf, zf + 0.02)];
  eyes.forEach(e => g.add(e));
  const squint = new THREE.Group();
  for (const [cx, dir] of [[-0.165, 1], [0.165, -1]]) {
    for (const s of [1, -1]) {
      const b = box(M.ink, -0.07, 0.07, -0.018, 0.018, 0, 0.02);
      b.position.set(cx, eyeY + s * 0.035, zf + 0.01); b.rotation.z = s * dir * 0.5;
      squint.add(b);
    }
  }
  squint.visible = false; g.add(squint);
  g.add(box(M.ink, -0.05, 0.05, eyeY - 0.17, eyeY - 0.14, zf, zf + 0.02));
  let shades = null;
  if (glasses) {
    shades = new THREE.Group();
    shades.add(box(M.ink, -0.29, -0.03, -0.075, 0.06, 0, 0.035));
    shades.add(box(M.ink, 0.03, 0.29, -0.075, 0.06, 0, 0.035));
    shades.add(box(M.ink, -0.035, 0.035, 0.01, 0.045, 0, 0.03));
    shades.add(box(M.ink, -0.33, -0.29, 0.0, 0.045, -0.3, 0.03));
    shades.add(box(M.ink, 0.29, 0.33, 0.0, 0.045, -0.3, 0.03));
    shades.position.set(0, eyeY, zf + 0.01);
    g.add(shades);
  }
  if (pencil) {
    const p = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.95, 6), M.pencil);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.17, 6), M.wood); tip.position.y = -0.56; tip.rotation.x = Math.PI;
    const er = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.072, 0.12, 6), M.eraser); er.position.y = 0.53;
    p.add(body, tip, er);
    p.position.set(B / 2 + 0.13, legH + 0.42, 0.05); p.rotation.z = -0.18;

}

function shadesMesh(M) {
  const s = new THREE.Group();
  s.add(box(M.ink, -0.29, -0.03, -0.075, 0.06, -0.02, 0.02));
  s.add(box(M.ink, 0.03, 0.29, -0.075, 0.06, -0.02, 0.02));

}

function paperBoat(M) {
  const g = new THREE.Group();
  const sh = new THREE.Shape();
  sh.moveTo(-0.74, 0.36); sh.lineTo(0.74, 0.36); sh.lineTo(0.44, 0); sh.lineTo(-0.44, 0); sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.8, bevelEnabled: false });
  geo.translate(0, -0.14, -0.4);
  const hull = new THREE.Mesh(geo, M.paper);
  g.add(hull);
  // folded side flaps give it the paper-boat silhouette
  const f = new THREE.Shape(); f.moveTo(-0.5, 0); f.lineTo(0.5, 0); f.lineTo(0, 0.3); f.closePath();
  for (const z of [-0.41, 0.37]) {
    const flap = new THREE.Mesh(new THREE.ExtrudeGeometry(f, { depth: 0.04, bevelEnabled: false }), M.paper);
    flap.position.set(0, 0.2, z); g.add(flap);
  }

}

// ─────────────────────────────────────────────────────────────
//  The Penrose waterway
//  z-bar runs from (0,0,L) to the seam at the origin; x-bar from (0,0,L) to
//  the pool at (L,0,L); the pillar climbs to (L,L,L), which projects onto the
//  origin under the isometric view. The last stretch of the z-bar is drawn
//  after a depth clear so it sits "in front" of the pillar top.
// ─────────────────────────────────────────────────────────────
const P1 = new THREE.Vector3(L, YW, L + W / 2 + 0.55);          // landing point in the pool
const G_FLOAT = new THREE.Vector3(L - 0.45, YW + 0.03, L + W * 1.18);
// A sluice gate closes the channel just behind the waterfall's lip (which, on screen, sits at z = W/2),
// so the boat stops against it and tips over right where the fall picks up.
const GATE_Z = W / 2 - 0.14;
const LIP_Z = W / 2 + 0.3;                           // where the fall phase starts, in channel terms
const PEND = new THREE.Vector3(0, YW, LIP_Z + 0.4);
const TIP_DROP = 0.3;
const curve = new THREE.CatmullRomCurve3([
  P1,
  new THREE.Vector3(L - 1.6, YW, L + W / 2 + 0.42),
  new THREE.Vector3(XP0 - 0.2, YW, L),
  new THREE.Vector3(W * 0.4, YW, L),
  new THREE.Vector3(0, YW, L - W * 0.4),
  new THREE.Vector3(0, YW, W * 1.6),
  PEND,
], false, 'centripetal');
const FISH_TIP = new THREE.Vector3(3.3, TOP + 1.95, L - 0.15);
const BOBBER = new THREE.Vector3(3.55, YW, L + 0.05);
const lineGeo = new THREE.BufferGeometry().setFromPoints([FISH_TIP, BOBBER]);
const LEDGE_Y = L - 1.5 * W;

// ─────────────────────────────────────────────────────────────
//  Keeping the illusion from any angle
//  The seam at the origin and the pillar top at (b, c, a) coincide on screen only when that gap
//  points straight at the camera. So instead of forbidding other angles, the loop re-proportions
//  its three arms (a = z-channel, b = x-channel, c = pillar) to keep the gap on the view axis.
//  Everything is built at nominal size (all arms L) and pushed through per-axis maps: identity
//  below a zone, shifted by (arm - L) above it, stretched linearly across it.
// ─────────────────────────────────────────────────────────────
const D = { a: L, b: L, c: L };
const MIN_ARM = { a: 4, b: 5, c: 6 };
const ZONES = { x: [1.2, XP0], y: [2.2, LEDGE_Y - 0.4], z: [1.2, L - W / 2 - 0.3] };
const ARM = { x: 'b', y: 'c', z: 'a' };
function mapAxis(ax, v) {
  const [z0, z1] = ZONES[ax], d = D[ARM[ax]] - L;
  if (v <= z0) return v;
  if (v >= z1) return v + d;
  return z0 + (v - z0) * (z1 + d - z0) / (z1 - z0);
}
function slopeAxis(ax, v) {
  const [z0, z1] = ZONES[ax];
  return v > z0 && v < z1 ? (z1 + D[ARM[ax]] - L - z0) / (z1 - z0) : 1;
}
function mapV(p, out = p) { return out.set(mapAxis('x', p.x), mapAxis('y', p.y), mapAxis('z', p.z)); }

function buildLevel(M) {
  const g = new THREE.Group();
  const over = [], details = [], pieces = [];
  // fit: 'stretch' for long axis-aligned pieces that span a zone; otherwise the piece moves rigidly
  // with its anchor (its own position unless given)
  const add = (o, layer = 0, fit = null) => { g.add(o); if (layer) over.push(o); pieces.push({ o, fit }); return o; };
  const live = o => { g.add(o); return o; };   // positioned every frame in already-mapped space
  const X0 = -W / 2, X1 = W / 2, IW = W - 2 * RIM;

  // z-bar (seam part is overlay)
  const zbar = (z0, z1, layer) => {
    const cap = layer ? 4 : -1;   // the overlay piece must not draw its +z cap over the main piece
    add(box(M.stone, X0, X1, -W / 2, FLOOR, z0, z1, cap), layer, 'stretch');
    add(box(M.rim, X0, X0 + RIM, FLOOR, TOP, z0, z1, cap), layer, 'stretch');
    add(box(M.rim, X1 - RIM, X1, FLOOR, TOP, z0, z1, cap), layer, 'stretch');
    add(waterRect(M.water, X0 + RIM, X1 - RIM, z0, z1, YW, (x, z) => [(x - X0 - RIM) / IW, 2 * L - z]), layer, 'stretch');
  };
  zbar(-W / 2, ZSPLIT + 0.01, OVERLAY);
  const nMain = g.children.length;
  zbar(ZSPLIT, L - W / 2, 0);
  // The overlay pass clears depth; re-lay the main z-bar's depth first so the two halves meet cleanly
  for (const m of g.children.slice(nMain)) {
    const twin = new THREE.Mesh(m.geometry, DEPTH_ONLY);
    twin.position.copy(m.position); twin.layers.set(PRIME); twin.renderOrder = -1;
    add(twin, 0, 'stretch');
  }

  // corner B
  add(box(M.stone, X0, X1, -W / 2, FLOOR, L - W / 2, L + W / 2));
  add(box(M.rim, X0, X0 + RIM, FLOOR, TOP, L - W / 2, L + W / 2));
  add(box(M.rim, X0 + RIM, X1, FLOOR, TOP, L + W / 2 - RIM, L + W / 2));
  add(waterRect(M.water, X0 + RIM, X1, L - W / 2, L + W / 2 - RIM, YW, (x, z) => [(z - L + W / 2) / (W - RIM), 2 * L - z]));

  // x-bar
  add(box(M.stone, X1, XP0, -W / 2, FLOOR, L - W / 2, L + W / 2), 0, 'stretch');
  add(box(M.rim, X1, XP0, FLOOR, TOP, L - W / 2, L - W / 2 + RIM), 0, 'stretch');
  add(box(M.rim, X1, XP0, FLOOR, TOP, L + W / 2 - RIM, L + W / 2), 0, 'stretch');
  add(waterRect(M.water, X1, XP0, L - W / 2 + RIM, L + W / 2 - RIM, YW, (x, z) => [(z - (L - W / 2 + RIM)) / IW, L + W / 2 - x]), 0, 'stretch');

  // pool at the foot of the waterfall
  const PX1 = L + W / 2, PZ1 = L + 1.5 * W;
  add(box(M.stone, XP0, PX1, -W / 2, FLOOR, L - W / 2, PZ1));
  add(box(M.rim, XP0, PX1, FLOOR, TOP, L - W / 2, L - W / 2 + RIM));
  add(box(M.rim, PX1 - RIM, PX1, FLOOR, TOP, L - W / 2, PZ1));
  add(box(M.rim, XP0, PX1 - RIM, FLOOR, TOP, PZ1 - RIM, PZ1));
  add(box(M.rim, XP0, XP0 + RIM, FLOOR, TOP, L + W / 2 - RIM, PZ1 - RIM));
  add(waterRect(M.water, XP0 + 0.001, PX1 - RIM, L - W / 2 + RIM, PZ1 - RIM, YW - 0.001, (x, z) => [(z - L + W / 2) / (2 * W), L + W / 2 - x]));
  for (const [x, z, r] of [[L + 0.55, L + 2.05, 0.3], [XP0 + 0.55, L + 2.0, 0.24]]) {
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.04, 14), M.leaf);
    pad.position.set(x, YW + 0.02, z); add(pad);
  }

  // pillar
  const PT = L + W / 2;
  add(box(M.stone, L - W / 2, L + W / 2, FLOOR, PT - GROOVE, L - W / 2, L + W / 2), 0, 'stretch');
  const pillarTop = [];
  pillarTop.push(add(box(M.rim, L - W / 2, L - W / 2 + RIM, PT - GROOVE, PT, L - W / 2, L + W / 2)));
  pillarTop.push(add(box(M.rim, L + W / 2 - RIM, L + W / 2, PT - GROOVE, PT, L - W / 2, L + W / 2)));
  pillarTop.push(add(box(M.rim, L - W / 2 + RIM, L + W / 2 - RIM, PT - GROOVE, PT, L - W / 2, L - W / 2 + RIM)));
  pillarTop.push(add(waterRect(M.water, L - W / 2 + RIM, L + W / 2 - RIM, L - W / 2 + RIM, L + W / 2, L + YW, (x, z) => [(x - L + W / 2 - RIM) / IW, z])));

  // waterfall down the +z face
  const fx0 = L - W / 2 + RIM, fx1 = L + W / 2 - RIM, fz = L + W / 2 + 0.03, fy0 = L + YW, fy1 = YW;
  const fall = quad(M.fall, [[fx0, fy0, fz], [fx1, fy0, fz], [fx1, fy1, fz], [fx0, fy1, fz]], [[0, 0], [1, 0], [1, fy0 - fy1], [0, fy0 - fy1]]);
  fall.renderOrder = 2; add(fall, 0, 'stretch');
  const foam = [];
  for (let i = 0; i < 7; i++) {
    const f = box(M.foam, -0.09, 0.09, -0.05, 0.05, -0.09, 0.09);
    f.position.set(fx0 + (i + 0.5) * (fx1 - fx0) / 7, YW + 0.03, fz + 0.12 + (i % 2) * 0.12);
    foam.push(add(f));
  }

  // lookout on a ledge, with a pencil
  add(box(M.stone, L + W / 2, L + W / 2 + 0.95, LEDGE_Y - 0.34, LEDGE_Y, L - 0.55, L + 0.55));
  const lookout = creature(M, { pencil: true });
  lookout.g.position.set(L + W / 2 + 0.48, LEDGE_Y, L); lookout.g.rotation.y = Math.PI / 4; lookout.g.scale.setScalar(0.9);
  add(lookout.g);

  // fisher at the outer corner
  const fisher = creature(M);
  fisher.g.position.set(X0 + 0.34, TOP, L + W / 2 - 0.34); fisher.g.rotation.y = Math.PI / 4; fisher.g.scale.setScalar(0.85);
  add(fisher.g);
  const hand = new THREE.Vector3(X0 + 0.78, TOP + 0.42, L + W / 2 - 0.3);
  const fisherAt = fisher.g.position;   // rod, line and bobber travel with the fisher
  details.push(add(stick(M.wood, hand, FISH_TIP, 0.045), 0, fisherAt));
  details.push(add(new THREE.Line(lineGeo, M.line), 0, fisherAt));
  const bobber = new THREE.Group();
  const bb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), M.bobber);
  const bt = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2), M.paper); bt.position.y = 0.02;
  bobber.add(bb, bt); bobber.position.copy(BOBBER); add(bobber, 0, fisherAt);

  // sluice gate and the stone end-cap behind it (seam side, so drawn in the overlay pass)
  add(box(M.rim, X0 + RIM, X1 - RIM, FLOOR, TOP, -W / 2, GATE_Z - 0.04), OVERLAY);
  add(box(M.wood, X0 + RIM, X1 - RIM, YW - 0.12, TOP + 0.2, GATE_Z - 0.04, GATE_Z + 0.05), OVERLAY);
  for (const x of [X0 + RIM / 2, X1 - RIM / 2]) {
    add(box(M.wood, x - 0.07, x + 0.07, TOP, TOP + 0.5, GATE_Z - 0.06, GATE_Z + 0.07), OVERLAY);
    add(box(M.ink, x - 0.09, x + 0.09, TOP + 0.5, TOP + 0.56, GATE_Z - 0.08, GATE_Z + 0.09), OVERLAY);
  }
  add(box(M.wood, X0 + RIM / 2 - 0.07, X1 - RIM / 2 + 0.07, TOP + 0.36, TOP + 0.44, GATE_Z - 0.03, GATE_Z + 0.05), OVERLAY);
  for (let i = 0; i < 5; i++) {   // churn where the water meets the gate
    const f = box(M.foam, -0.08, 0.08, -0.04, 0.04, -0.08, 0.08);
    f.position.set(X0 + RIM + (i + 0.5) * IW / 5, YW + 0.03, GATE_Z + 0.14 + (i % 2) * 0.1);
    foam.push(add(f, OVERLAY));
  }

  // lanterns (glow at night)
  const glows = [];
  for (const p of [[X1 - RIM / 2, TOP, L * 0.72], [L * 0.5, TOP, L + W / 2 - RIM / 2], [PX1 - RIM / 2, TOP, PZ1 - RIM / 2], [L + W / 2 + 0.85, LEDGE_Y, L - 0.45]]) {
    const base = new THREE.Vector3(...p);
    details.push(add(stick(M.wood, base, base.clone().add(new THREE.Vector3(0, 0.6, 0)), 0.05), p[2] < ZSPLIT ? OVERLAY : 0));
    const lamp = box(M.lamp, -0.09, 0.09, 0, 0.2, -0.09, 0.09); lamp.position.copy(base).y += 0.62;
    details.push(add(lamp, p[2] < ZSPLIT ? OVERLAY : 0));
    const s = new THREE.Sprite(M.glow); s.position.copy(lamp.position); s.scale.setScalar(1.8);
    add(s, p[2] < ZSPLIT ? OVERLAY : 0); glows.push(s);
  }

  // rider on a paper boat
  const boat = paperBoat(M);
  const rider = creature(M, { glasses: true });
  rider.g.scale.setScalar(0.82); rider.g.position.y = -0.04;
  boat.add(rider.g);
  boat.rotation.order = 'YZX';
  live(boat);

  const fshades = shadesMesh(M); live(fshades);

  const rings = [];
  for (let i = 0; i < 7; i++) {
    const m = new THREE.Mesh(new THREE.RingGeometry(0.34, 0.42, 28), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; rings.push(live(m));
  }
  const splash = [];
  for (let i = 0; i < 12; i++) splash.push(live(box(M.foam, -0.06, 0.06, -0.06, 0.06, -0.06, 0.06)));

  over.forEach(o => setLayer(o, OVERLAY));
  for (const p of pieces) {
    p.o.updateMatrix();
    p.pos0 = p.o.position.clone(); p.scale0 = p.o.scale.clone();
    if (p.fit === 'stretch') { p.o.geometry.computeBoundingBox(); p.box = p.o.geometry.boundingBox.clone().applyMatrix4(p.o.matrix); }
    else if (p.fit) p.anchor = p.fit.clone();
    else if (p.o.isMesh && !p.o.position.lengthSq()) { p.o.geometry.computeBoundingBox(); p.anchor = p.o.geometry.boundingBox.getCenter(new THREE.Vector3()); }
    else p.anchor = p.o.position.clone();
  }
  return { g, M, boat, rider, fshades, rings, splash, bobber, lookout, fisher, foam, details, pillarTop, pieces };
}

const _fa = new THREE.Vector3(), _fb = new THREE.Vector3();
function fitLevel(lv) {
  for (const p of lv.pieces) {
    if (p.box) {
      mapV(p.box.min, _fa); mapV(p.box.max, _fb);
      for (const ax of 'xyz') {
        const span = p.box.max[ax] - p.box.min[ax], s = span > 1e-6 ? (_fb[ax] - _fa[ax]) / span : 1;
        p.o.scale[ax] = p.scale0[ax] * s;
        p.o.position[ax] = _fa[ax] + (p.pos0[ax] - p.box.min[ax]) * s;
      }
    } else {
      p.o.position.copy(p.pos0).add(mapV(p.anchor, _fa).sub(p.anchor));
    }
  }
}

const MATS = makeMats();
const levels = COPIES.map(k => {
  const lv = buildLevel(MATS);
  lv.k = k;
  lv.g.position.copy(STEP).multiplyScalar(k);
  scene.add(lv.g);
  return lv;
});
const lv0 = levels.find(l => l.k === 0);

// ─────────────────────────────────────────────────────────────
//  Loop timeline (a pure function of time, so every level agrees)
// ─────────────────────────────────────────────────────────────
const SETTLE = 1.0, TIP = 0.45, FALL = 1.25, SPEED = 2.1;
const ROUTE = curve.getLength() / SPEED;
const T_LOOP = SETTLE + ROUTE + TIP + FALL;
const yawOf = d => Math.atan2(-d.z, d.x);
const YAW0 = yawOf(curve.getTangentAt(0));
const smooth = u => u * u * (3 - 2 * u);
const clamp01 = u => Math.min(1, Math.max(0, u));
function lerpAngle(a, b, u) { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * u; }
const tV = new THREE.Vector3(), nV = new THREE.Vector3();
const P1m = new THREE.Vector3(), GFm = new THREE.Vector3();
// Boat path in nominal space, pushed through the current arm lengths
function boatAt(t, out) {
  let tl = ((t % T_LOOP) + T_LOOP) % T_LOOP;
  out.t = tl;
  if (tl < SETTLE) {
    const u = tl / SETTLE;
    out.phase = 'settle'; out.u = u; mapV(P1, out.pos);
    out.pos.y += -0.2 * Math.sin(Math.PI * Math.min(1, u * 1.4)) * (1 - u);
    out.yaw = lerpAngle(-Math.PI / 2, YAW0, smooth(u)); out.pitch = 0.3 * (1 - smooth(Math.min(1, u * 2))); out.layer = 0;
    return out;
  }
  tl -= SETTLE;

// ─────────────────────────────────────────────────────────────
//  Background bokeh + foreground motes (2D canvases)
// ─────────────────────────────────────────────────────────────
const bg = $('bg'), bctx = bg.getContext('2d');
const fx = $('fx'), fctx = fx.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const blobs = Array.from({ length: 28 }, (_, i) => ({ x: Math.random(), y: Math.random(), r: rnd(0.05, 0.22), rot: rnd(0, Math.PI), el: rnd(0.35, 1),
  ci: i % 4, a: rnd(0.14, 0.42), sp: rnd(0.2, 0.8), ph: rnd(0, 6.28) }));
const motes = Array.from({ length: 46 }, () => ({ x: Math.random(), y: Math.random(), r: rnd(1, 2.6), sp: rnd(0.2, 1), ph: rnd(0, 6.28) }));
const rgba = (c, a) => { const o = {}; c.getRGB(o, THREE.SRGBColorSpace); return `rgba(${(o.r * 255) | 0},${(o.g * 255) | 0},${(o.b * 255) | 0},${a})`; };
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  bg.width = Math.ceil(innerWidth / 3); bg.height = Math.ceil(innerHeight / 3);
  const d = Math.min(devicePixelRatio, 2); fx.width = innerWidth * d; fx.height = innerHeight * d;
}
addEventListener('resize', resize); resize();

function drawBg(t) {
  const w = bg.width, h = bg.height, m = Math.max(w, h);
  const gr = bctx.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, rgba(cur.bgTop, 1)); gr.addColorStop(1, rgba(cur.bgBot, 1));
  bctx.globalCompositeOperation = 'source-over';
  bctx.fillStyle = gr; bctx.fillRect(0, 0, w, h);
  for (const b of blobs) {
    const x = (b.x + 0.015 * Math.sin(t * 0.07 * b.sp + b.ph)) * w, y = (b.y + 0.012 * Math.cos(t * 0.05 * b.sp + b.ph)) * h, r = b.r * m;
    bctx.save(); bctx.translate(x, y); bctx.rotate(b.rot + 0.05 * Math.sin(t * 0.1 + b.ph)); bctx.scale(1, b.el);
    const rg = bctx.createRadialGradient(0, 0, 0, 0, 0, r);
    const c = cur.bokeh[b.ci];
    rg.addColorStop(0, rgba(c, b.a)); rg.addColorStop(0.55, rgba(c, b.a * 0.55)); rg.addColorStop(1, rgba(c, 0));
    bctx.fillStyle = rg; bctx.beginPath(); bctx.arc(0, 0, r, 0, Math.PI * 2); bctx.fill(); bctx.restore();
  }
  const vg = bctx.createRadialGradient(w * 0.6, h * 0.5, m * 0.2, w * 0.5, h * 0.5, m * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${0.18 + cur.night * 0.2})`);
  bctx.fillStyle = vg; bctx.fillRect(0, 0, w, h);
}
function drawFx(t) {
  const w = fx.width, h = fx.height, d = Math.min(devicePixelRatio, 2);
  fctx.clearRect(0, 0, w, h);
  const night = cur.night;
  for (const p of motes) {
    const x = ((p.x + 0.02 * Math.sin(t * 0.3 * p.sp + p.ph) + t * 0.004 * p.sp) % 1) * w;
    const y = ((p.y - t * 0.006 * p.sp + 10) % 1) * h;
    const tw = 0.5 + 0.5 * Math.sin(t * (1.5 + p.sp * 2) + p.ph);
    const a = (0.25 + night * 0.65) * (night > 0.5 ? tw * tw : 0.6 + 0.4 * tw);
    const r = p.r * d * (1 + night * 1.6);
    const rg = fctx.createRadialGradient(x, y, 0, x, y, r * 4);
    const col = night > 0.5 ? `255,226,140` : `255,250,230`;
    rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(0.3, `rgba(${col},${a * 0.35})`); rg.addColorStop(1, `rgba(${col},0)`);
    fctx.fillStyle = rg; fctx.beginPath(); fctx.arc(x, y, r * 4, 0, Math.PI * 2); fctx.fill();
  }
}

// ─────────────────────────────────────────────────────────────
//  Main loop
// ─────────────────────────────────────────────────────────────
let last = performance.now() / 1000;
function frame(nowMs) {
  const now = nowMs / 1000, dt = Math.min(0.05, now - last); last = now;
  if (!qs.has('freeze')) simT += dt * (reduceMotion ? 0.6 : 1);
  uTime.value = simT;
  updatePalette(dt);
  updateOrbit(dt);
  updateTween(dt);
  fitLoop();

  state.ride += ((state.mode === 'ride' ? 1 : 0) - state.ride) * (1 - Math.exp(-dt * 2.2));

  animate(simT);
  updateCamera();
  const fpOn = state.mode === 'fp';
  if (fpOn) updateFP(dt, simT);
  updateCopies();
  renderCard(currentChapter());
  updateAngleTag(fpOn);
  document.body.classList.toggle('close', !fpOn && state.zoom * (1 - state.ride) < 0.6);

  renderer.clear();
  if (fpOn) {
    renderer.render(scene, fpCam);
  } else if (aim.ok) {
    camera.layers.set(0); renderer.render(scene, camera);
    renderer.clearDepth();
    camera.layers.set(OVERLAY); camera.layers.enable(PRIME); renderer.render(scene, camera);
  } else {
    camera.layers.enableAll(); camera.layers.disable(PRIME); renderer.render(scene, camera);
  }
  drawBg(simT); drawFx(simT);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__iso = { state, setTime, setMode, goChapter, goView, D, aim, tween, updateTween, timing: { SETTLE, ROUTE, TIP, FALL } };
</script>
</body>
