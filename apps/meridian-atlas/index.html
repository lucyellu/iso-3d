function getActiveMeridian(hour) {
  for (const m of MERIDIANS) {
    if (m.peakStart < 0) continue;
    if (m.peakStart > m.peakEnd) {
      if (hour >= m.peakStart || hour < m.peakEnd) return m.id;
    } else {
      if (hour >= m.peakStart && hour < m.peakEnd) return m.id;
    }
  }
  return null;
}

// Compute hour and minute for a given date in a given IANA timezone.
// Returns null if timezone is invalid.
function getTimeInZone(date, timezone) {
  try {
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: timezone,
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    });
    const parts = fmt.formatToParts(date);
    const h = parseInt(parts.find((p) => p.type === "hour").value, 10);
    const m = parseInt(parts.find((p) => p.type === "minute").value, 10);
    // Some platforms emit "24" for midnight in en-US 24h — normalize.
    return { hour: h % 24, minute: m };
  } catch {
    return null;
  }
}

// Detect user's local IANA timezone (best effort).
function detectLocalTimezone() {
  try {
    return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
  } catch {
    return "UTC";
  }
}

// Mirror an SVG path across x=200 for bilateral rendering.
function mirrorPath(d) {
  const cmdArgs = { M:2, L:2, Q:4, C:6, T:2, S:4, A:7, H:1, V:1, Z:0,
                    m:2, l:2, q:4, c:6, t:2, s:4, a:7, h:1, v:1, z:0 };
  const tokens = [];
  let i = 0;
  while (i < d.length) {
    const c = d[i];
    if (/[a-zA-Z]/.test(c)) {
      tokens.push({ kind: "cmd", val: c });
      i += 1;
    } else if (/[0-9.]/.test(c) || (c === "-" && (i === 0 || !/[0-9]/.test(d[i-1])))) {
      let j = i + 1;
      while (j < d.length && /[0-9.]/.test(d[j])) j += 1;
      tokens.push({ kind: "num", val: parseFloat(d.slice(i, j)) });
      i = j;
    } else {
      i += 1;
    }
  }
  const out = [];
  let k = 0;
  while (k < tokens.length) {
    const t = tokens[k];
    if (t.kind === "cmd") {
      const cmd = t.val;
      const n = cmdArgs[cmd] || 0;
      const args = [];
      for (let a = 0; a < n; a += 1) {
        const nxt = tokens[k + 1 + a];
        if (nxt && nxt.kind === "num") args.push(nxt.val);
      }
      const mirrored = args.map((val, idx) => {
        if (cmd === "H") return 400 - val;
        if (cmd === "h") return -val;
        if (cmd === "V" || cmd === "v") return val;
        if (idx % 2 === 0) return cmd === cmd.toUpperCase() ? 400 - val : -val;
        return val;
      });
      out.push(cmd + " " + mirrored.map((v) => +v.toFixed(2)).join(" "));
      k += 1 + n;
    } else {
      k += 1;
    }
  }
  return out.join(" ");
}

// ============================================================
// MOBILE DRAWER — slide-in panel from left/right edge
// ============================================================

function MobileDrawer({ side, open, onClose, title, children }) {
  // Lock body scroll when drawer open
  useEffect(() => {
    if (!open) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, [open]);

  // Escape key closes
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open, onClose]);

  return (
    <AnimatePresence>
      {open && (
        <div className="lg:hidden fixed inset-0 z-50">
          {/* Backdrop */}
          <motion.div
            className="absolute inset-0 mobile-drawer-backdrop"
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
            onClick={onClose}
            transition={{ duration: 0.25 }}
          />
          {/* Panel */}
          <motion.div
            className={`absolute top-0 bottom-0 ${side === "left" ? "left-0" : "right-0"} mobile-drawer-panel`}
            initial={{ x: side === "left" ? "-100%" : "100%" }}
            animate={{ x: 0 }}
            exit={{ x: side === "left" ? "-100%" : "100%" }}
            transition={{ type: "spring", stiffness: 320, damping: 32 }}
          >
            <div className="flex items-center justify-between px-4 py-3 border-b atlas-divider">
              <span className="hanzi-display text-base ink-bright">{title}</span>
              <button onClick={onClose} className="drawer-close" aria-label="Close drawer">
                <span aria-hidden>✕</span>
              </button>
            </div>
            <div className="overflow-y-auto h-[calc(100%-49px)] p-3">
              {children}
            </div>
          </motion.div>
        </div>
      )}
    </AnimatePresence>
  );
}

// ============================================================
// BODY FIGURE — Vesalian engraving as base layer
// ============================================================

function BodyFigure({
  theme, view, meridians, elements, selectedId, hoveredId, selectedPoint, flowMode,
  onHoverMeridian, onSelectMeridian, onSelectPoint,
}) {
  const figureSrc = theme === "dark" ? FIGURE_DARK : FIGURE_LIGHT;

  return (
    <div className="ink-card relative overflow-hidden figure-frame" style={{ aspectRatio: "400 / 800" }}>
      <svg viewBox="0 0 400 800" className="w-full h-full block">
        <defs>
          <filter id="meridian-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="star-glow" x="-300%" y="-300%" width="700%" height="700%">
            <feGaussianBlur stdDeviation="3" result="blur1" />
            <feGaussianBlur stdDeviation="6" in="SourceGraphic" result="blur2" />
            <feMerge>
              <feMergeNode in="blur2" />
              <feMergeNode in="blur1" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <radialGradient id="point-halo-dark" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(255, 245, 210, 0.9)" />
            <stop offset="40%" stopColor="rgba(255, 235, 190, 0.3)" />
            <stop offset="100%" stopColor="rgba(255, 235, 190, 0)" />
          </radialGradient>
          <radialGradient id="point-halo-light" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(180, 60, 45, 0.55)" />
            <stop offset="40%" stopColor="rgba(180, 60, 45, 0.18)" />
            <stop offset="100%" stopColor="rgba(180, 60, 45, 0)" />
          </radialGradient>
        </defs>

        {/* Background ambience for the figure plate */}
        {theme === "dark" && (
          <g opacity="0.5">
            {BACKGROUND_STARS.map((s, i) => (
              <circle key={i} cx={s[0]} cy={s[1]} r={s[2]} fill="rgba(255, 235, 190, 0.35)" />
            ))}
          </g>
        )}

        {/* The Vesalian figure — placed once, scaled to fill viewBox 50..731 */}
        <AnimatePresence mode="wait">
          {view === "front" && (
            <motion.image
              key={`fig-${theme}`}
              href={figureSrc}
              x={FIGURE_X}
              y={FIGURE_Y}
              width={FIGURE_W}
              height={FIGURE_H}
              preserveAspectRatio="xMidYMid meet"
              initial={{ opacity: 0 }}
              animate={{ opacity: theme === "dark" ? 0.85 : 0.92 }}
              exit={{ opacity: 0 }}
              transition={{ duration: 0.6 }}
              style={{ pointerEvents: "none" }}
            />
          )}
        </AnimatePresence>

        {/* Channels group — Y-compressed to fit the figure */}
        <g className="channels-layer">
          {/* Meridian paths */}
          {meridians.map((m) => {
            const isSel = selectedId === m.id;
            const isHov = hoveredId === m.id;
            const isOther = !isSel && !isHov && (selectedId || hoveredId);
            const el = elements[m.element];
            const opacity = isSel ? 1 : isHov ? 0.78 : isOther ? 0.18 : (theme === "dark" ? 0.45 : 0.6);
            const strokeWidth = isSel ? 2.4 : isHov ? 2.1 : 1.5;
            const bilateral = !MIDLINE_MERIDIANS.has(m.id);
            const pathsToDraw = bilateral
              ? (m.pathL ? [m.path, m.pathL] : [m.path, mirrorPath(m.path)])
              : [m.path];

            return (
              <g key={m.id}>
                {pathsToDraw.map((d, idx) => (
                  <g key={idx}>
                    <path
                      d={d}
                      fill="none"
                      stroke={el.glow}
                      strokeWidth={strokeWidth + 10}
                      strokeLinecap="round"
                      opacity={isSel ? (theme === "dark" ? 0.12 : 0.08) : 0}
                      style={{ transition: "opacity 0.5s" }}
                    />
                    <path
                      d={d}
                      fill="none"
                      stroke={el.glow}
                      strokeWidth={strokeWidth + 4}
                      strokeLinecap="round"
                      opacity={isSel ? (theme === "dark" ? 0.25 : 0.15) : 0}
                      style={{ transition: "opacity 0.5s" }}
                    />
                    <path
                      d={d}
                      fill="none"
                      stroke={isSel ? el.glow : el.color}
                      strokeWidth={strokeWidth}
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      opacity={opacity}
                      filter={isSel && theme === "dark" ? "url(#meridian-glow)" : undefined}
                      style={{ transition: "opacity 0.5s, stroke-width 0.5s", cursor: "pointer" }}
                      onMouseEnter={() => onHoverMeridian(m.id)}
                      onMouseLeave={() => onHoverMeridian(null)}
                      onClick={() => onSelectMeridian(m.id)}
                    />
                    {isSel && (
                      <path
                        d={d}
                        fill="none"
                        stroke={theme === "dark" ? "rgba(255, 250, 225, 0.95)" : el.glow}
                        strokeWidth={strokeWidth + 0.5}
                        strokeLinecap="round"
                        strokeDasharray="5 220"
                        opacity={theme === "dark" ? 0.9 : 0.7}
                        style={{
                          animation: `shimmer-flow ${flowMode ? "2.4s" : "3.6s"} linear infinite`,
                        }}
                      />
                    )}
                  </g>
                ))}
              </g>
            );
          })}

          {/* Acupoints (selected meridian only) */}
          {(() => {
            const m = meridians.find((x) => x.id === selectedId);
            if (!m) return null;
            const el = elements[m.element];
            const bilateral = !MIDLINE_MERIDIANS.has(m.id);
            // For asymmetric meridians (have pathL), don't auto-mirror points — they don't land correctly.
            // For symmetric arm meridians, mirror across x=200 as before.
            const points = bilateral
              ? (m.pathL
                  ? m.points
                  : m.points.flatMap((p) => [p, { ...p, x: 400 - p.x, mirrored: true }]))
              : m.points;
            const haloId = theme === "dark" ? "point-halo-dark" : "point-halo-light";
            return points.map((p, i) => {
              const key = p.mirrored ? `${p.code}-r` : p.code;
              const isSelP = selectedPoint && selectedPoint.code === p.code && !p.mirrored;
              return (
                <g key={key}>
                  <circle
                    cx={p.x}
                    cy={p.y}
                    r={isSelP ? 22 : 10}
                    fill={`url(#${haloId})`}
                    opacity={isSelP ? 0.9 : 0.5}
                    style={{ transition: "all 0.4s", pointerEvents: "none" }}
                  />
                  {isSelP && (
                    <g opacity="0.85">
                      {[0, 45, 90, 135, 180, 225, 270, 315].map((angle) => {
                        const rad = (angle * Math.PI) / 180;
                        const len = 18;
                        return (
                          <line
                            key={angle}
                            x1={p.x}
                            y1={p.y}
                            x2={p.x + Math.cos(rad) * len}
                            y2={p.y + Math.sin(rad) * len}
                            stroke={el.glow}
                            strokeWidth="0.8"
                            strokeLinecap="round"
                            opacity="0.6"
                          >
                            <animate
                              attributeName="opacity"
                              values="0.2;0.7;0.2"
                              dur="2.8s"
                              repeatCount="indefinite"
                              begin={`${angle / 360}s`}
                            />
                          </line>
                        );
                      })}
                    </g>
                  )}
                  <circle
                    cx={p.x}
                    cy={p.y}
                    r={isSelP ? 3.5 : 2}
                    fill={isSelP ? el.glow : (theme === "dark" ? "rgba(255, 240, 210, 0.95)" : "#1a1410")}
                    filter={theme === "dark" ? "url(#star-glow)" : undefined}
                    style={{ transition: "all 0.3s", cursor: "pointer" }}
                    onClick={(e) => {
                      e.stopPropagation();
                      const canonical = p.mirrored ? m.points.find((q) => q.code === p.code) : p;
                      onSelectPoint(isSelP ? null : canonical);
                    }}
                  />
                  {isSelP && (
                    <g style={{ pointerEvents: "none" }}>
                      <text
                        x={p.x + 16}
                        y={p.y - 2}
                        fontSize="10"
                        fontFamily="'JetBrains Mono', monospace"
                        fill={el.glow}
                        style={{ letterSpacing: "0.1em" }}
                      >
                        {p.code}
                      </text>
                      <text
                        x={p.x + 16}
                        y={p.y + 12}
                        fontSize="13"
                        fontFamily="'Noto Serif SC', serif"
                        fill={theme === "dark" ? "rgba(255, 240, 210, 0.9)" : "#2a1f15"}
                      >
                        {p.hanzi}
                      </text>
                    </g>
                  )}
                </g>
              );
            });
          })()}

          {/* Flow-mode pulse */}
          {flowMode && (() => {
            const m = meridians.find((x) => x.id === selectedId);
            if (!m) return null;
            const el = elements[m.element];
            return (
              <circle r="5" fill={el.glow} filter={theme === "dark" ? "url(#star-glow)" : undefined}>
                <animateMotion dur="2.4s" repeatCount="indefinite" path={m.path} />
              </circle>
            );
          })()}
        </g>
      </svg>

      <div className="absolute top-3 left-3 corner-seal">
        <span className="hanzi-display text-xs">{view === "front" ? "前" : "經"}</span>
      </div>
      <div className="absolute top-3 right-3 corner-seal">
        <span className="hanzi-display text-xs">圖</span>
      </div>
    </div>
  );
}

const BACKGROUND_STARS = (() => {
  const seed = 12345;
  let s = seed;
  const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const stars = [];
  for (let i = 0; i < 180; i += 1) {
    stars.push([rand() * 400, rand() * 800, 0.3 + rand() * 0.8]);
  }
  return stars;
})();

      </div>
    </div>
  );
}

// ============================================================
// TIMEZONE PICKER — for the horary clock
// ============================================================

function TimezonePicker({ tzId, setTzId, localTz }) {
  const [open, setOpen] = useState(false);
  const current = TIMEZONE_PRESETS.find((t) => t.id === tzId) || TIMEZONE_PRESETS[0];
  // Display label: if "local", show actual zone name as a hint
  const display = tzId === "local"
    ? `Local (${localTz.split("/").pop().replace(/_/g, " ")})`
    : current.label;

  // Close on outside click
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (!e.target.closest(".tz-picker")) setOpen(false);
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  return (
    <div className="tz-picker relative">
      <button
        onClick={() => setOpen((o) => !o)}
        className="tz-button"
        title="Change timezone"
      >
        <span className="hanzi-display text-sm" style={{ marginRight: 6 }}>
          {current.hanzi}
        </span>
        <span className="font-mono text-[10px] uppercase tracking-[0.18em]">
          {display}
        </span>
        <span className="ink-dim ml-2 text-[9px]">▾</span>
      </button>
      {open && (
        <div className="tz-menu">
          {TIMEZONE_PRESETS.map((t) => {
            const isSel = t.id === tzId;
            return (
              <button
                key={t.id}
                onClick={() => { setTzId(t.id); setOpen(false); }}
                className={`tz-item ${isSel ? "tz-item-sel" : ""}`}
              >
                <span className="hanzi-display text-sm" style={{ width: 18 }}>
                  {t.hanzi}
                </span>
                <span className="font-display text-[13px] flex-1 text-left">
                  {t.label}
                  {t.id === "local" && (
                    <span className="font-mono text-[9px] ink-dim ml-2">
                      {localTz.split("/").pop().replace(/_/g, " ")}
                    </span>
                  )}
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ============================================================
// QI CLOCK
// ============================================================

function QiClock({ meridians, elements, timeInZone, activeId, selectedId, onSelect, tzId, setTzId, localTz }) {
  const primary = meridians.filter((m) => m.element !== "extra");
  const segments = [...primary].sort((a, b) => a.peakStart - b.peakStart);
  const minutesNow = timeInZone.hour * 60 + timeInZone.minute;
  const nowPct = (minutesNow / 1440) * 100;
  const hh = String(timeInZone.hour).padStart(2, "0");
  const mm = String(timeInZone.minute).padStart(2, "0");

  return (
    <div className="ink-card p-5">
      <div className="flex items-baseline justify-between mb-3 gap-4 flex-wrap">
        <div className="flex items-baseline gap-3">
          <span className="hanzi-display text-xl luminous-hanzi">子午流注</span>
          <span className="font-mono text-[9px] uppercase tracking-[0.3em] ink-dim">
            Horary Clock — Daily Flow of Qi
          </span>
        </div>
        <div className="flex items-center gap-3">
          <TimezonePicker tzId={tzId} setTzId={setTzId} localTz={localTz} />
          <div className="font-mono text-xs tabular-nums ink-mid min-w-[42px] text-right">
            {hh}:{mm}
          </div>
        </div>
      </div>

      <div className="relative h-3 mb-1">
        {[0, 3, 6, 9, 12, 15, 18, 21, 24].map((h) => (
          <div
            key={h}
            className="absolute top-0 font-mono text-[8px] ink-dim"
            style={{ left: `${(h / 24) * 100}%`, transform: "translateX(-50%)" }}
          >
            {h === 24 ? "24" : String(h).padStart(2, "0")}
          </div>
        ))}
      </div>

      <div className="relative h-12 rounded-sm overflow-hidden clock-rail">
        {segments.map((m) => {
          const el = elements[m.element];
          const start = m.peakStart;
          let end = m.peakEnd;
          const isWrap = start > end;
          const isSel = selectedId === m.id;
          const isAct = activeId === m.id;

          if (isWrap) {
            return (
              <React.Fragment key={m.id}>
                <ClockSegment m={m} el={el} leftPct={(start / 24) * 100} widthPct={((24 - start) / 24) * 100}
                              isSel={isSel} isAct={isAct} onSelect={onSelect} />
                <ClockSegment m={m} el={el} leftPct={0} widthPct={(end / 24) * 100}
                              isSel={isSel} isAct={isAct} onSelect={onSelect} hideLabel />
              </React.Fragment>
            );
          }
          return (
            <ClockSegment key={m.id} m={m} el={el}
                          leftPct={(start / 24) * 100} widthPct={((end - start) / 24) * 100}
                          isSel={isSel} isAct={isAct} onSelect={onSelect} />
          );
        })}

        <div
          className="absolute top-0 bottom-0 w-px now-line"
          style={{ left: `${nowPct}%` }}
        >
          <div className="absolute -top-1 -left-[3px] w-[7px] h-[7px] rounded-full now-dot" />
        </div>
      </div>
      <p className="font-body italic text-[11px] mt-3 leading-relaxed ink-mid">
        Each of the twelve organ meridians is said to peak in two-hour windows across the day —
        Lung from 3–5 AM, Large Intestine 5–7 AM, and so on — completing one full circuit every 24 hours.
        The cinnabar line marks the present moment in the selected timezone; the segment beneath it is the meridian
        whose qi is currently most active.
      </p>
    </div>
  );
}

function ClockSegment({ m, el, leftPct, widthPct, isSel, isAct, onSelect, hideLabel }) {
  return (
    <button
      onClick={() => onSelect(m.id)}
      className="absolute top-0 bottom-0 group transition-all"
      style={{
        left: `${leftPct}%`,
        width: `${widthPct}%`,
        background: isSel
          ? `linear-gradient(180deg, ${el.glow} 0%, ${el.color} 100%)`
          : isAct
          ? `linear-gradient(180deg, ${el.color}bb 0%, ${el.color}dd 100%)`
          : `${el.color}22`,
        borderLeft: leftPct > 0 ? "1px solid rgba(120, 100, 70, 0.12)" : "none",
        boxShadow: isSel ? `inset 0 0 16px ${el.glow}88, 0 0 12px ${el.color}66` : undefined,
      }}
    >
      {!hideLabel && (
        <span
          className="absolute inset-0 flex items-center justify-center font-mono text-[10px] tracking-wider transition-opacity clock-label"
          style={{
            opacity: isSel || isAct ? 1 : 0.7,
            color: isSel || isAct ? "#1a1520" : undefined,
          }}
        >
          {m.code}
        </span>
      )}
    </button>
  );
}

    background: linear-gradient(155deg, rgba(245, 232, 200, 0.98) 0%, rgba(228, 210, 170, 0.96) 100%);
    box-shadow: 0 0 40px rgba(80, 50, 20, 0.3);
  }
  .mobile-drawer-panel:nth-of-type(2),
  .absolute.right-0.mobile-drawer-panel {
    border-right: none;
    border-left: 1px solid var(--line);
  }

  .drawer-close {
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--ink-mid);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 12px;
  }
  .drawer-close:hover, .drawer-close:active {
    color: var(--ink-bright);
    border-color: var(--ink-mid);
  }

  /* Tighter padding on mobile */
  @media (max-width: 1023px) {
    .ink-card {
      border-radius: 2px;
    }
  }


  /* ===== Timezone picker ===== */
  .tz-picker { position: relative; }
  .tz-button {
    display: inline-flex;
    align-items: center;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--ink-mid);
    background: var(--card-bg);
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
  }
  .tz-button:hover {
    color: var(--ink-bright);
    border-color: var(--ink-mid);
  }
  .tz-menu {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    z-index: 50;
    min-width: 240px;
    max-height: 360px;
    overflow-y: auto;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    box-shadow: var(--card-shadow);
    backdrop-filter: blur(8px) saturate(1.2);
    padding: 4px 0;
  }
  .tz-item {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 7px 12px;
    color: var(--ink-mid);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    text-align: left;
  }
  .atlas-dark .tz-item:hover { color: var(--ink-bright); background: rgba(230, 210, 170, 0.05); }
  .atlas-light .tz-item:hover { color: var(--ink-bright); background: rgba(60, 40, 20, 0.04); }
  .atlas-dark .tz-item-sel { color: var(--ink-bright); background: rgba(230, 210, 170, 0.08); }
  .atlas-light .tz-item-sel { color: var(--ink-bright); background: rgba(60, 40, 20, 0.06); }

`;


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(MeridianMap));

const m = document.getElementById('boot-msg');
if (m) m.style.display = 'none';
  </script>
